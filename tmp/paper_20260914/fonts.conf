<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <cachedir>/private/tmp/vacant-paper-font-cache</cachedir>
  <alias><family>serif</family><prefer><family>Times New Roman</family><family>Songti TC</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Arial</family><family>Heiti TC</family></prefer></alias>
</fontconfig>
