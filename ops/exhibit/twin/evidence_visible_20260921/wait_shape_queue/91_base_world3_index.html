<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vacant World 3</title>
<style>
  html,body{margin:0;height:100%;background:#120c07;overflow:hidden;cursor:none}
  canvas{display:block;width:100vw;height:100vh}
  body.debug{cursor:default}
</style>
<script src="bridge.js?v=5" defer></script>
</head>
<body>
<canvas id="cv"></canvas>
<script>
/* ══════════════════════════════════════════════════════════════════
   Vacant World 3 — 打掉重做版（2026-08-30 人類令：逐張對照劇照重建）

   架構＝預渲染電影板＋活體合成（冒險遊戲手法）：
     板（codex 依劇照生成的空舞台）→ 活體（144 段鍵控影片精靈）
     → 動態道具（透明 PNG）→ 覆蓋（光束閃爍/顆粒/暗角）→ 活文字（真資料）
   world2 的教訓全部帶著：
   - 文字絕不烙進板（判決與數字是真紀錄，烙死＝把模擬講成證明）
   - 鍵器單台共享；VS 的 -p.y（半格 bug 抓過）
   - 影池 LRU cap＋404 黑名單 3 分鐘特赦
   - 綠幕舉綠牌會被鍵掉（人類抓到）→ 磁性幕片 actm_/magm_ ＋ 鍵器雙模式
   ══════════════════════════════════════════════════════════════════ */
"use strict";
const cv = document.getElementById("cv");
const cx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = LITE ? 1 : Math.min(devicePixelRatio || 1, 2);   // 輕量版省一半以上像素
  W = cv.width = innerWidth * DPR; H = cv.height = innerHeight * DPR;
  cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";
  buildGrain();
}
addEventListener("resize", resize);
const Q = new URLSearchParams(location.search);
// 人類 2026-09-21：「畫面太複雜了」。SIMPLE 預設開，`?full=1` 回到舊版。
// 減的是**層數**不是位置——位置微調救不了三層搶同一塊畫面。
const SIMPLE = Q.get("full") === null;
const FAST = Q.has("fast") ? 6 : 1;
// 輕量版（人類 2026-09-05：「之後要有輕量版讓別人在網路上操作」）：
// 不載任何影片（20 段背景片 ~12MB＋154 段精靈片 ~26MB），改用靜態板＋PNG 精靈。
// 故事、監視器、案例輪替、真資料全部保留——少的只有動態影像。
// 手機或窄螢幕自動啟用；?lite=0 可強制關閉、?lite=1 強制開啟。
const LITE = Q.get("lite") === "1" ? true
           : Q.get("lite") === "0" ? false
           : (innerWidth < 900 || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent));

/* ── 板（每場一張，codex 生成後選定變體命名為 sNN.jpg）─────────── */
const plates = new Map();               // sc → {img, ok}
function plate(sc){
  // 板也髒的景借一張中性的板（見 SCENE_PLATE_SUB 的註解：這是權宜不是解法）。
  const name = SCENE_PLATE_SUB[sc] || plateAlias[sc] || sc;
  let e = plates.get(name);
  if (!e){
    const img = new Image();
    e = { img, ok: false, fail: false };
    img.onload = () => e.ok = true;
    img.onerror = () => e.fail = true;
    img.src = Q.get("plate_" + sc) || `plates/${name}.jpg`;
    plates.set(name, e);
  }
  return e;
}
/* 板光照圖：把板降採樣成 32×18，生物走到哪就吃哪裡的光——
   「貼在板上」vs「活在光裡」的分水嶺（人類 2026-09-01 點名的融合度問題）。 */
const lightMaps = new Map();
function lightMapOf(e){
  let lm = lightMaps.get(e.img);
  if (lm || !e.ok) return lm || null;
  const c = document.createElement("canvas");
  c.width = 32; c.height = 18;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.drawImage(e.img, 0, 0, 32, 18);
  lm = g.getImageData(0, 0, 32, 18).data;
  lightMaps.set(e.img, lm);
  return lm;
}
function sampleLight(nx, ny){
  // 取生物「身體中段」的光（腳位 ny 往上抓一點）。雙線性內插：
  // 32×18 粗格用最近格會「跨一格跳一色」——人類抓的變色主因之一。
  const e = plate(sceneId);              // 影片板時仍用 jpg 板當光照代理（同一布景）
  const lm = lightMapOf(e);
  if (!lm) return { lum: 0.55, r: 1, g: 0.92, b: 0.82 };
  const fx = Math.max(0, Math.min(30.999, nx * 31));
  const fy = Math.max(0, Math.min(16.999, (ny - 0.10) * 17));
  const x0 = fx | 0, y0 = fy | 0, tx = fx - x0, ty = fy - y0;
  const at = (x, y, k) => lm[(y * 32 + x) * 4 + k] / 255;
  const bi = k =>
    (at(x0,y0,k)*(1-tx) + at(x0+1,y0,k)*tx) * (1-ty) +
    (at(x0,y0+1,k)*(1-tx) + at(x0+1,y0+1,k)*tx) * ty;
  const r = bi(0), g2 = bi(1), b = bi(2);
  const lum = 0.2126*r + 0.7152*g2 + 0.0722*b;
  const m = Math.max(r, g2, b, 0.04);
  return { lum, r: r/m, g: g2/m, b: b/m };
}
// 每隻生物的光做時間平滑：目標光用「連續位置」採樣（光是空氣不量化），
// 應用光以 ~0.3s 半衰滑過去——顏色只會「滑」，永遠不會「跳」。
function smoothLight(cr){
  const t = sampleLight(cr.nx, cr.ny);
  if (!cr._lt){ cr._lt = { ...t }; return cr._lt; }
  const a = 0.10;
  for (const k of ["lum", "r", "g", "b"]) cr._lt[k] += (t[k] - cr._lt[k]) * a;
  return cr._lt;
}
// v4 場景影片層（SPEC v4：電視畫面＝渲染圖本人在動）。有片就播片、沒片退回板。
// 這些片是「含生物的整格渲染」，所以有片的場景引擎不再疊人口精靈（BAKED_SCENES）。
// 可用變體由 scenes/index.json 決定（品質閘門產出：漂移 RMSE>30 的片不列入）。
// 索引沒到之前先假設 v1；到了就照索引輪換，沒列的場景直接退回 jpg 板。
let SCENE_INDEX = null;
// ⚠ `cache: "no-cache"`＝每次載入都去問一次（不是 no-store，命中就 304，4KB 而已）。
//   2026-09-20 實測踩到：換上 s10 的新素材之後，**index.html 是新的、
//   `scenes/index.json` 卻是瀏覽器快取裡的舊的**（SimpleHTTP 只給 Last-Modified、
//   沒有 Cache-Control ⇒ Chrome 走啟發式快取）。結果畫面照舊輪播被判定為髒的
//   `scene_s10_v2.mp4`，而頁面上**看不出任何異常**。
//   換素材的人只會「重新載入頁面」，不會想到要清快取 ⇒ 這一行不能省。
fetch("scenes/index.json", {cache: "no-cache"}).then(r => r.json()).then(j => {
  SCENE_INDEX = j.scenes || {};
  warmSceneCache();          // 開場就把全部背景片抓進 HTTP 快取
}).catch(() => { SCENE_INDEX = {}; });
// 快取暖機：用 fetch 把 20 段背景片拉進瀏覽器快取（不建 <video>，不吃媒體元素上限）。
// 之後任何一場要播時，video 元素直接從快取拿＝零網路等待，換場不再閃。
// 一次一支、序列拉，不跟正在播的那支搶頻寬。
async function warmSceneCache(){
  if (LITE) return;                    // 輕量版不預抓影片
  const urls = [];
  for (const [sc, vs] of Object.entries(SCENE_INDEX))
    for (const v of vs) urls.push(`scenes/scene_${sc}_${v}.mp4`);
  let done = 0;
  for (const u of urls){
    try { await fetch(u, { cache: "force-cache" }); done++; } catch(e){}
    window.__warm = `${done}/${urls.length}`;
  }
}
const sceneVidTurn = {};
/** `director` 可能還在 TDZ（它在檔案後面才宣告）。`typeof` 對 TDZ 的 const
 *  也會丟，所以用 try/catch。 */
function _dirSafe(){ try { return director; } catch (e){ return null; } }

function sceneVariants(sc){
  if (LITE) return [];                 // 輕量版：不播背景影片，退回 jpg 板
  // ⚠ **背景影片會演系統裡沒有的機制。** 判準在 SCENE_VIDEO_DEPICTS
  //   （52 張素材逐張看過之後整理出來的表）。機制不存在 ⇒ 不放那支影片，
  //   退回靜態板；板也髒的那兩景另外借一張中性的板（SCENE_PLATE_SUB）。
  const dep = SCENE_VIDEO_DEPICTS[sc];
  if (dep && !dep.ok(_dirSafe() && _dirSafe().row)) return [];
  if (SCENE_INDEX === null) return ["v1"];
  return SCENE_INDEX[sc] || [];
}
function sceneVideoSrc(sc){
  const vs = sceneVariants(sc);
  if (!vs.length) return null;
  if (!(sc in sceneVidTurn)) sceneVidTurn[sc] = 0;
  return `scenes/scene_${sc}_${vs[sceneVidTurn[sc] % vs.length]}.mp4`;
}
function sceneVideoReady(sc){
  const src = sceneVideoSrc(sc);
  if (!src || videoMissing.has(src)) return null;
  const v = getVideo(src, { loop: false });   // 不用原生 loop：接縫由雙變體交叉溶接處理
  return (v && v.readyState >= 2 && v.videoWidth) ? v : null;
}
// loop 接縫：當前變體剩 0.6s 時，下一個變體從頭淡入，然後換手（兩個變體輪流，
// 觀眾看到的是一段永不重播的連續畫面）
const XF = 0.6;
// 場景影片曝光補償：A14B i2v 出來的片比劇照暗兩成（實測 still 33.9 → 影格 26.7），
// 而且第 0 幀亮、第 1 幀起變暗＝每次 loop 起點閃一下。做法：每支片量一次中段亮度，
// 對照同場 jpg 板的亮度算增益，畫的時候用 filter brightness 拉齊；起播跳過前 0.25s。
const sceneGain = new Map();
const sceneMeasCv = document.createElement("canvas"); sceneMeasCv.width = 32; sceneMeasCv.height = 18;
function meanLuma(imgLike){
  const g = sceneMeasCv.getContext("2d", { willReadFrequently: true });
  g.drawImage(imgLike, 0, 0, 32, 18);
  const d = g.getImageData(0, 0, 32, 18).data; let y = 0;
  for (let i = 0; i < d.length; i += 4) y += 0.2126*d[i] + 0.7152*d[i+1] + 0.0722*d[i+2];
  return y / (d.length / 4);
}
function sceneGainFor(sc, v){
  const key = v.currentSrc || v.src;
  if (sceneGain.has(key)) return sceneGain.get(key);
  if (v.currentTime < 0.4) return 1;                 // 第 0 幀偏亮，等進入穩態再量
  const e = plate(sc);
  if (!e.ok) return 1;
  try {
    const gv = meanLuma(v), gp = meanLuma(e.img);
    const g = Math.min(1.5, Math.max(0.8, gp / Math.max(1, gv)));
    sceneGain.set(key, g);
    return g;
  } catch(err){ sceneGain.set(key, 1); return 1; }
}
window.__sceneGain = sceneGain;
function drawCover(v, alpha, sc){
  const iw = v.videoWidth, ih = v.videoHeight;
  const k = Math.max(W/iw, H/ih), dw = iw*k, dh = ih*k;
  const gain = sc ? sceneGainFor(sc, v) : 1;
  cx.save();
  cx.globalAlpha = alpha;
  if (cx.filter !== undefined && Math.abs(gain - 1) > 0.02) cx.filter = `brightness(${gain.toFixed(3)})`;
  cx.drawImage(v, (W-dw)/2, (H-dh)/2, dw, dh);
  cx.restore();
  cx.globalAlpha = 1;
}
let lastGoodFrame = null, lastGoodScene = null;
function drawPlate(sc){
  const sv = sceneVideoReady(sc);
  if (!sv && lastGoodFrame && lastGoodScene === sc){
    // 換手/重載的空窗：沿用上一張好畫面，不要閃回靜態板（人類看到的 fallback）
    cx.drawImage(lastGoodFrame, 0, 0, W, H);
    return true;
  }
  if (sv){
    const remain = (sv.duration || 5) - sv.currentTime;
    const vs = sceneVariants(sc);
    const nextSrc = vs.length > 1
      ? `scenes/scene_${sc}_${vs[(sceneVidTurn[sc] + 1) % vs.length]}.mp4` : null;
    const nv = (nextSrc && !videoMissing.has(nextSrc)) ? getVideo(nextSrc, { loop: false }) : null;
    if (remain <= XF && nv && nv.readyState >= 2 && nv.videoWidth){
      if (nv.currentTime > 1 || nv.paused){ nv.currentTime = 0.25; nv.play().catch(()=>{}); }
      drawCover(sv, 1, sc);
      drawCover(nv, 1 - Math.max(0, remain) / XF, sc);
      if (remain <= 0.05 || sv.ended){ sceneVidTurn[sc] += 1; }   // 換手：下一幀主片＝nv
      return true;
    }
    if (sv.ended){ sv.currentTime = 0.25; sv.play().catch(()=>{}); }  // 沒有下一變體：硬接
    drawCover(sv, 1, sc);
    // 存一張「最後的好畫面」供空窗期沿用（每 12 幀存一次，成本可忽略）
    if ((frameCount & 11) === 0){
      if (!lastGoodFrame){ lastGoodFrame = document.createElement("canvas"); }
      if (lastGoodFrame.width !== 640){ lastGoodFrame.width = 640; lastGoodFrame.height = 360; }
      try { lastGoodFrame.getContext("2d").drawImage(cv, 0, 0, 640, 360); lastGoodScene = sc; } catch(e){}
    }
    return true;
  }
  const e = plate(sc);
  if (!e.ok){                            // 板還沒到：深棕底不裸奔（僅開發期）
    cx.fillStyle = "#1c140d"; cx.fillRect(0, 0, W, H);
    return false;
  }
  // cover-fit：1536x1024 → 全螢幕，置中裁切
  const iw = e.img.naturalWidth, ih = e.img.naturalHeight;
  const k = Math.max(W/iw, H/ih), dw = iw*k, dh = ih*k;
  cx.drawImage(e.img, (W-dw)/2, (H-dh)/2, dw, dh);
  return true;
}
// 前景遮擋層：與板同尺寸的透明 PNG（桌子等擋在生物前的布景件），
// 用與 drawPlate 完全相同的 cover-fit 數學畫 → 像素級對位
const fgCache = new Map();
function drawPlateFg(name){
  let e = fgCache.get(name);
  if (!e){
    const img = new Image();
    e = { img, ok:false };
    img.onload = () => e.ok = true;
    img.onerror = () => e.fail = true;
    img.src = `plates/${name}.png`;
    fgCache.set(name, e);
  }
  if (!e.ok) return;
  const iw = e.img.naturalWidth, ih = e.img.naturalHeight;
  const k = Math.max(W/iw, H/ih), dw = iw*k, dh = ih*k;
  cx.drawImage(e.img, (W-dw)/2, (H-dh)/2, dw, dh);
}
/* 道具（透明 PNG；v1..v3 都可指定）──────────────────────────── */
const propCache = new Map();
function prop(name){
  let e = propCache.get(name);
  if (!e){
    const img = new Image();
    e = { img, ok:false };
    img.onload = () => e.ok = true;
    img.src = `props/${name}.png`;
    propCache.set(name, e);
  }
  return e.ok ? e.img : null;
}
// 畫在標準化座標，h＝相對畫面高
function drawProp(name, nx, ny, h, { rot=0, alpha=1, anchor="bottom" } = {}){
  const img = prop(name);
  if (!img) return false;
  const w = h * img.naturalWidth / img.naturalHeight;
  cx.save();
  cx.translate(nx*W, ny*H);
  if (rot) cx.rotate(rot);
  cx.globalAlpha = alpha;
  cx.drawImage(img, -w*H/2, anchor === "bottom" ? -h*H : -h*H/2, w*H, h*H);
  cx.restore();
  cx.globalAlpha = 1;
  return true;
}
// QR：**執行期跟著展場機走，而且常駐**。
//
// ⚠ 三個實測問題一起解：
//   (a) `world3/qr.png` 是 2026-08-30 的骨架佔位圖，比 `phone.html` 早三個星期；
//       `--lan` 之後手機要連的是展場機的區網 IP（每次開機可能不同）
//       ⇒ **烤死的 QR 必然指到錯的地方**。改抓 `<展場機>/qr.png`（執行期畫的）。
//   (b) 舊版只在步 1 出現約 20 秒，而引導有 11 步 ⇒ 中途走過來的人要等好幾分鐘。
//       ⇒ 改成**每一個畫面都在左上角**。
//   (c) s01 的陶板**自己就刻了一個大而糊的 QR 紋**，真 QR 疊在上面
//       ⇒ 相機可能鎖錯。所以不再貼板上。
//   ⇒ 而且網址一律以文字印在 QR 底下：掃不到還可以用打的。
//     一張掃不開又沒有替代路徑的 QR 是展場當天最難察覺的故障。
const qrImg = new Image();
let qrWanted = null;
function qrRefresh(){
  const want = qrSource(LIVE.stage, LIVE.url);
  if (want === qrWanted) return;
  qrWanted = want;
  if (want) qrImg.src = want;
}
/** 版面尺規：**不要直接用 `H`**。
 *
 *  ⚠ 2026-09-19 在 1080×1920（直式）實測到的：這一整頁的座標都以 `H` 為單位
 *    （`H*0.04`、`H*0.235`、`s = H*0.165`），那在 16:9 上剛好，但螢幕一變窄，
 *    `H` 就變成一個**跟可用寬度無關**的大數 ⇒ 左上角那張 QR 漲到蓋住副標
 *    「用你自己的手機就好」，底下的網址整行橫跨畫面壓在陶板上。
 *    展場螢幕不保證是 16:9（掛直式的展牆很常見）。
 *  ⇒ 尺規改成 `min(W, H)`。
 *
 *  為什麼是 `min(W, H)` 而不是「寬度撐得起的 16:9 高度」（`min(H, W*9/16)`）：
 *  後者在**橫式**也會生效（4:3 的 1024×768 會把 QR 從 127px 縮到 95px），
 *  等於為了修直式去動已經驗過的橫式版面。`min(W, H)` 在任何橫式螢幕上
 *  **恆等於 `H`**（W>H ⇒ min＝H），所以 1920×1080／1024×768／1280×1024／
 *  2560×1080／3840×2160 **逐像素與舊版相同、零回歸風險**；
 *  只有直式（W<H）才換成以寬度為尺規，而那正是壞掉的那一種。
 *  實測：1080×1920 下 QR 從 317px（蓋住副標）變成 178px（掃得到、不蓋字）。
 */
function uiScale(){ return Math.min(W, H); }

function drawQrCorner(){
  qrRefresh();
  // 🔴 **觀眾掃的是「觀展者的頁」，不是導播頁**（2026-09-20 人類指定）。
  //   `visitor_url` ＝ 觀展者頁（公網，觀眾用自己的手機、自己的 AI 生分身卡）
  //   `phone_url`   ＝ **導播**頁（展場那台、要 token、給操作的人）
  //   兩件事不要合併。`visitor_url` 沒設才退回舊行為。
  const st = LIVE.stage;
  const url = (st && st.visitor_url) || (st && st.phone_url);
  const isVisitor = !!(st && st.visitor_url);
  if (!qrWanted || !url) return;                 // 沒接展場機就不要畫一塊空白
  const U = uiScale();
  // ⚠ 原本 y=U*0.235 在標題欄裡，實測與大標及 verdictBig 疊在一起。
  //   移到左下角：中途走過來的人照樣掃得到，但不再跟文字搶。
  const x = U*0.035, y = SIMPLE ? U*0.700 : U*0.235, s = U*0.150;
  if (qrImg.complete && qrImg.naturalWidth){
    cx.save();
    cx.fillStyle = "#fff";
    cx.fillRect(x - U*0.006, y - U*0.006, s + U*0.012, s + U*0.012);
    cx.drawImage(qrImg, x, y, s, s);
    cx.restore();
  }
  cx.save();
  cx.textAlign = "left";
  cx.font = serif(U*0.0165, 600);
  cx.fillStyle = "rgba(240,232,216,0.86)";
  // ⚠ 字要跟 QR 指的地方一致——指觀展者頁卻寫「決定要看哪一邊」是對觀眾說錯話。
  cx.fillText(isVisitor ? "用你自己的 AI，做一個你" : "用手機決定要看哪一邊",
              x, y + s + U*0.030);

  const bloom = Math.min(1, t / 1.2) ** 0.6 + 0.14 * Math.exp(-2.6 * t);
  const L = scene().lights || [{ x: 0.5, w: 1.0 }];
  for (const b of L){
    const flick = (0.05 + 0.03 * Math.sin(ph * 2.1 + b.x * 9) + 0.015 * Math.sin(ph * 7.7 + b.x * 5)) * bloom;

      g.addColorStop(1, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a*0.6*ATM_WASH})`);

      cx.font = serif(H*0.019, 600);

    cx.fillText("一次演一位 · 依抵達順序", g.x + U*0.018, g.y + g.h - U*0.014);

      this.cooldown -= dt;
      if (LIVE.url && LIVE.on){                 // 活模式：真 agent 的事件優先
        const lt = liveAssemble(LIVE, livePreempt(LIVE));
        // P1（D1）：**頭號路障在這裡。** 舊版寫 `if (lt && byAgent[lt.ON.worker])`，
        // 而 `byAgent` 的鍵是寫死的六個原型名（careful-1/2、plain-1/2、hasty-1/2），
        // twin 的居民叫 DUL-89／KAL-52／LIV-51 ⇒ 條件恆假；而 `liveAssemble` 已經
        // 先把事件從 pending 刪掉了 ⇒ **每一筆被靜靜丟棄，畫面毫無反應、
        // 主控台沒有半個字**。現在：名字對不上就借一個空著的造型上台，
        // 畫面上一律用真名。借不到（連一個造型都沒有）才放棄，而且會說出來。
        if (lt){
          if (this.bindCast(lt)){ this.caseKind = "live"; this.startReplay(lt); return; }
          console.warn("[live] 一個造型都借不到，這一格沒有上台：", lt.id);
          LIVE.dropped.push({ task_id: lt.id, why: "沒有任何可用的造型" });
        }
      }
      if (this.cooldown <= 0 && REPLAY){
        const t = this.pick();
        if (t){ this.startReplay(t); return; }
        this.cooldown = 5;
      }
      if (this.t > 46){ this.t = 0; this.mode = "invite"; this.inviteStep = 0; }
      return;
    }
    if (this.mode === "visitor_spawn"){
      const card = this.visitorCard || {};
      if (this.t < beat("spawn", true)){
        // DECISION_20260921_TWIN_CONSENT_AND_ERASURE §三-3：公共大螢幕**不准印
        // 觀眾打的原話**（以前這裡直接印 card.need 前 26 字）。改成代號＋類別
        // （visitorLabel），人形與造型分類（shape/color/texture）完全不動。
        this.caption = this.visitorId ? `他帶著一件事來：${visitorLabel(card, this.visitorId)}` : "";
        this.capSub = "";
      } else {
        // 步 5：目標泡泡
        this.mode = "visitor_goal";
        let matched = null;
        if (window.WorldBridge && REPLAY && card.need){
          matched = WorldBridge.matchTask(card.need,
            REPLAY.tasks.map(t=>({id:t.id, prompt:t.prompt, _t:t})));
        }
        this.visitorTask = matched && matched.task ? matched.task._t : null;
        this.bubbleText = this.visitorTask
          ? (this.visitorTask.keyword_zh || this.visitorTask.id) : "……";
        const s = SCENES.s05;
        const sil = this.crowd(7, [this.visitor]);
        this.enterScene("s05", [
          [this.visitor, s.slots[0], {dir:1, k:1.25}],
          ...sil.map((c, i) => [c, s.slots[i+1], {dim: 0.85}]),
        ]);
        this.caption = ""; this.capSub = "";
      }
      return;
    }
    if (this.mode === "visitor_goal"){
      if (this.t > beat("goal", true)){
        this.bubbleText = null;
        const t = this.visitorTask;
        if (t && t.ON && t.ON.votes && byAgent[t.ON.worker]){
          this.capSub = `他的需求最像世界做過的 ${t.id}——重放那一次`;
          this.startReplay(t, true);
        } else {
          this.caption = "世界裡沒有夠像的往事";
          this.capSub = "沒跑過就是沒跑過——他先留下來走走";
          this.finishVisitor(null);
          this.mode = "ambient"; this.enterScene("s11");
          cast.forEach(c => { c.onstage = true; });
        }
      }
      return;
    }
    // ── 重放五場（s06→s07→(s08)→(s09)→s10）──
    // **演到一半也要讓位給手機按鍵。** 一格演完要 20–30 秒；按下去卻要等
    // 上一格把故事說完，對按鍵的人來說就是「沒反應」。他剛剛選了要看哪一邊，
    // 把上一格的尾巴放完不是尊重那個選擇。
    // ⚠ 同樣只認人按的（`livePreempt` 只看 `why: phone*`），而且一次按壓只會
    //   插播一次——那一格被組起來之後就離開佇列，`livePreempt` 隨即回 null。
    if (LIVE.url && LIVE.on && !this.visitor){
      const want = livePreempt(LIVE);
      if (want){
        const lt = liveAssemble(LIVE, want);
        if (lt && this.bindCast(lt)){
          this.caseKind = "live"; this.startReplay(lt); return;
        }
      }
    }
    const row = this.row;
    if (this.mode === "replay_route" && this.t > beat("route", !!this.visitor)){
      // P8（A1）：**沒有評審層就不要演評審。** 舊版無論如何都進 s07，活模式的
      // `votes` 恆為 `[]` ⇒ 畫面變成「三人同儕評審：0/0 判可」＋一句系統根本
      // 沒有的承諾（「判否必須附可執行反例」）。空台子配一個憑空多出來的層。
      if (!row.has_review_layer){
        // P8。⚠ 這裡改過兩次，第二次是被**截圖**改回去的：
        //
        //   第一版照提案「跳過 s07」。
        //   第二版我改成「不要跳過，改演閘門」——理由是少演真的東西也是失真。
        //   1920×1080 實跑截圖打臉：**s07 的底圖是烤死的評審室**
        //   （`world3/scenes/scene_s07_v*.mp4`：三個人圍著一份文件、兩個舉紅綠牌）。
        //   字幕寫「這條路上沒有同儕評審」，正上方的畫面卻是三個人在投票。
        //   **一張圖蓋得過字幕。** 所以回到提案原本的寫法。
        //
        // 不是靜默跳過：閘門那句話帶到判決拍的副標上（skipNote），
        // 而且監視器整格都在講閘門（判決／嘗試次數）。話一句都沒有少，
        // 少的是一張我們**沒有**的圖——見裁決文「還不能說的話」的素材缺口那一條。
        const gb = gateBeat(row);
        this.skipNote = `${gb.caption}；${gb.sub}`;
        const rb0 = reviseBeat(row);
        if (rb0){
          // 重改那一拍留著：s08 的底圖是「一個人在重寫、滿地紙團」，
          // 那件事在這條路上**是真的**（同一個 agent 帶著失敗原文再跑一次）。
          // 但舉紅牌那個人要拿掉——這條路上沒有第二個人。
          const s8 = SCENES.s08;
          this.mode = "replay_revise";
          this.enterScene("s08", [
            [this.castOf(row.worker), s8.slots[0], {act:"write", dir:1}],
            ...(this.visitor ? [[this.visitor, [0.90, 0.66], {dim:0.4, dir:-1}]] : []),
          ]);
          this.caption = rb0.caption; this.capSub = rb0.sub;
        } else {
          this.toAuditOrVerdict();
        }
        return;
      }
      const s = SCENES.s07;
      const votes = (row.votes || []).slice(0, 3);
      const marks = [s.slots[0], s.slots[1], s.slots[2]];
      const assigns = votes.map((v, i) => {
        const c = this.castOf(v[0]);
        const actName = i === 0 ? "lens" : (v[1] ? "card_pass" : "card_fail");
        return [c, marks[i], { act: actName, dir: marks[i][0] < 0.5 ? 1 : -1 }];
      });
      if (this.visitor) assigns.push([this.visitor, [0.90, 0.66], {dim: 0.4, dir: -1}]);
      this.mode = "replay_review";
      this.enterScene("s07", assigns);
      const pass = votes.filter(v=>v[1]).length;
      this.caption = `${votes.length} 人同儕評審：${pass}/${votes.length} 判可`;
      this.capSub = "判否必須附可執行反例，系統會真的跑一次";
    }
    else if (this.mode === "replay_review" && this.t > beat("review", !!this.visitor)){
      // P12（C1）：Vacant 的重改**不是**「評審推翻之後換人重寫」，而是
      // 「閘門擋下 → 把可見驗收的失敗原文給它 → **同一個 agent** 再跑一次」。
      // R530／R532 量到增益的那個東西就是這一段；把它演成換人重寫＝演了別的系統。
      const rb = reviseBeat(row);
      if (rb){
        const s = SCENES.s08;
        this.mode = "replay_revise";
        this.enterScene("s08", [
          [this.castOf(row.reviser || row.worker), s.slots[0], {act:"write", dir:1}],
          [this.castOf(row.worker), s.slots[1], {act:"card_fail", dir:-1}],
          ...(this.visitor ? [[this.visitor, [0.90, 0.66], {dim:0.4, dir:-1}]] : []),
        ]);
        this.caption = rb.caption;
        this.capSub = rb.sub;
      } else {
        // 沒有走到重改。照實說，不要靜默跳過。
        // ⚠ 舊版寫「閘門一次就過，沒有再跑一次」。日常中文裡「一次就過」＝
        //   「第一次就通過」，而這一格的大標是「這一份沒有交出去」、判決是
        //   「擋下」——同一個畫面自己打自己。原意是「閘門只跑了一次」。
        this.skipNote = (this.skipNote ? this.skipNote + "；" : "")
          + (row.has_review_layer ? "這一次沒有進到修訂"
             : "閘門只跑了一次，沒有再給它第二次機會");
        this.toAuditOrVerdict();
      }
    }
    else if (this.mode === "replay_revise" && this.t > beat("revise", !!this.visitor)){ this.toAuditOrVerdict(); }
    else if (this.mode === "replay_audit" && this.t > beat("audit", !!this.visitor)){ this.toVerdict(); }
    else if (this.mode === "replay_verdict" && this.t > beat("verdict", !!this.visitor)){
      if (this.visitorId){ this.startReceipt(); }
      else { this.startChain(); }             // 無訪客：也要看到收據上鏈
    }
    else if (this.mode === "replay_chain" && this.t > beat("chain", false)){ this.endReplay(); }
    else if (this.mode === "visitor_receipt" && this.t > beat("receipt", true)){ this.endReplay(); }
  },
  startVisitor(sub){
    arrivals.spawned(sub.id);       // 陶牌上劃掉這一位（他從「排隊中」變成台上）
    this.visitorId = sub.id; this.visitorCard = sub.card; this.visitorSub = sub;
    const img = pickCastFor(sub.card || {});
    const cr = new Creature(img);
    cr.vid = img._id;
    cr.spawning = 1; cr.reserved = true; cr.wander = false;
    cast.push(cr); this.visitor = cr;
    marklayer.onStart(sub, cr);      // 標示層：這一隻身上的記號（見 MARK-LAYER 區塊）
    const s = SCENES.s04;
    const ring = this.crowd(7, [cr]);
    this.mode = "visitor_spawn";
    this.enterScene("s04", [
      [cr, s.slots[0]],
      ...ring.map((c, i) => [c, s.slots[i+1]]),
    ]);
  },
  /** P1（D1）：把事件裡的真名綁到 `byAgent` 的某一個造型上。
   *  綁得到回 true。`castOf(name)` 之後一律用它取造型——**不再直接查 byAgent**。 */
  bindCast(t){
    this.castMap = this.castMap || {};
    const keys = Object.keys(byAgent);
    if (!keys.length) return false;
    const names = [t.ON.worker, ...(t.ON.revisions || []).map(r => r.reviser),
                   ...(t.ON.votes || []).map(v => v[0])].filter(Boolean);
    // 已經借出去的造型一律先佔住：兩位居民共用一張臉會毀掉剪影辨識度，
    // 而剪影是展場隔一段距離之後唯一還看得見的東西（ops/exhibit/PLAN.md §四）。
    const taken = {};
    for (const k of Object.keys(this.castMap)) taken[this.castMap[k]] = true;
    for (const n of names){
      if (this.castMap[n]){ taken[this.castMap[n]] = true; continue; }
      const pick = castKeyFor(n, keys, taken);
      if (!pick) return false;
      this.castMap[n] = pick.key; taken[pick.key] = true;
      if (pick.borrowed) console.info(`[live] ${n} 沒有自己的造型，借用 ${pick.key} 上台`);
    }
    return !!(t.ON.worker && this.castMap[t.ON.worker]);
  },
  /** 名字 → 造型。活模式走 castMap，凍結重放直接是原型名。 */
  castOf(name){
    if (!name) return null;
    const k = (this.castMap && this.castMap[name]) || name;
    return byAgent[k] || null;
  },
  startReplay(t, isVisitor){
    t = normalizeTask(t);
    this.task = t; this.row = t.ON;
    this.mode = "replay_route";
    const s = SCENES.s06;
    const w = this.castOf(this.row.worker);
    const others = Object.values(byAgent).filter(c => c !== w).slice(0, 3);
    const queue = this.crowd(3, [this.visitor]);
    const assigns = [
      ...others.map((c, i) => [c, s.slots[i], {dim: 0.35, dir: 1}]),
      [w, [0.58, 0.84], {dir: 1}],
      ...queue.map((c, i) => [c, s.slots[4+i] || s.slots[4], {dim: 0.2}]),
    ];
    if (this.visitor) assigns.push([this.visitor, [0.94, 0.64], {dim: 0.4, dir: -1}]);
    this.enterScene("s06", assigns);
    if (w) w.goTo(0.66, 0.84);
    const lab = !isVisitor && this.caseKind && this.CASE_LABEL[this.caseKind];
    this.caption = isVisitor ? "你的需求，交給誰做" : (lab ? lab[0] : "");
    // P11（A3）：以前這裡寫死「依信譽紀錄路由給 X」。`vacant run` **沒有路由層**
    // （誰做這一格是人指定的，生產端老實發 `basis:"random"`），而凍結重放的資料
    // 根本沒記路由依據。兩種情況都不准寫成「依信譽紀錄」。
    this.capSub = isVisitor || !lab
      ? routeText(t)
      : lab[1](this.caseTotals[this.caseKind]);
  },
  toAuditOrVerdict(){
    const row = this.row;
    if (row.audited){
      const s = SCENES.s09;
      this.mode = "replay_audit";
      const watchers = [...Object.values(byAgent).slice(0, 4), ...this.crowd(4, [this.visitor])];
      this.enterScene("s09", [
        ...watchers.slice(0, 8).map((c, i) => [c, s.slots[i], {dim: 0.3}]),
        ...(this.visitor ? [[this.visitor, [0.94, 0.62], {dim:0.4, dir:-1}]] : []),
      ]);
      this.auditText = `抽中 ${this.task.id} · sha256 ${(this.task.sha || "").slice(0,8) || "重驗中"}`;
      this.caption = ""; this.capSub = "";
    } else {
      // A2（P7）：「這條路上沒有這一層」與「有這一層、這次沒抽中」不是同一件事。
      // 舊版一律印「抽樣沒抽中」＝替一個不存在的抽樣器作證。
      this.skipNote = (this.skipNote ? this.skipNote + "；" : "")
        + (row.has_audit_layer ? "抽樣沒抽中這一題，這一次不稽核"
                               : "這條路上沒有抽樣稽核這一層");
      this.toVerdict();
    }
  },
  toVerdict(){
    const row = this.row, t = this.task;
    this.mode = "replay_verdict";
    // 被擋下的案子演專屬的「退件」場景——這是 Vacant 最獨特的一刻，不該跟漏出共用畫面
    const useBlocked = !row.accepted;
    const s = useBlocked ? SCENES.s12 : SCENES.s10;
    const left = this.crowd(3, [this.visitor]);
    const right = Object.values(byAgent).slice(0, 3);
    if (useBlocked){
      const w = this.castOf(row.worker);
      this.enterScene("s12", [
        [w, s.slots[0], {dir: 1, act: "carry"}],                  // 交付的人
        // 退件：把它推回去的人。**活模式沒有評審層**（沒有 votes）⇒ 退件的是閘門，
        // 不是某一個人；這裡就讓一個沒在演的居民站位，字幕那一邊由 P9 講清楚理由。
        [this.castOf((row.votes||[])[0]?.[0]) || right[0], s.slots[1], {dir: -1}],
        ...left.slice(0, 2).map((c, i) => [c, s.slots[i+2], {dim: 0.45}]),
        ...(this.visitor ? [[this.visitor, [0.90, 0.66], {dim:0.35, dir:-1}]] : []),
      ]);
    } else {
      this.enterScene("s10", [
        ...left.map((c, i) => [c, s.slots[i], {dim: 0.25}]),
        ...right.map((c, i) => [c, s.slots[i+3], {dim: 0.25}]),
        ...(this.visitor ? [[this.visitor, [0.5, 0.64], {dir:1}]] : []),
      ]);
    }
    // P5（B1）／P9（A5）：三值一路保到大字上。`accepted` 是 null 就是「沒量」，
    // 不是「擋下」；`meets_demand` 是 null 就講「沒量」，不准講成「其實漏出」。
    this.verdict = verdictBig(row);
    // P10（A4）：`OFF` 是 null ⇒ **同題沒有跑過關掉這層的對照**。
    // 舊版 `t.OFF || {}` ⇒ `off.accepted` undefined ⇒ 印「也擋下」
    // ＝替一個沒跑過的反事實作證。展場主視覺就是這個對照，這條錯得最貴。
    const off = t.OFF;
    const cmp = offLine(t) || meetsDemandNote(row);
    // 逾時那幾格要自己講，而且**不要替它編原因**。
    const parts = [timedOutNote(row), this.skipNote, cmp].filter(Boolean);
    this.capSub = parts.join("　·　");
    this.skipNote = null;
    this.caption = "";
  },
  finishVisitor(taskPlayed){
    this.receiptCreature = this.visitor || this.receiptCreature;
    if (!this.visitor || !this.visitorId || !window.WorldBridge){
      this.visitor = null; this.visitorId = null; this.visitorCard = null; this.visitorSub = null; return;
    }
    const card = this.visitorCard || {}, id = this.visitorId;
    const verdictText = taskPlayed
      ? (this.verdict ? this.verdict.big : "他看見了整個過程")
      : "他加入了這個世界";
    const tone = this.verdict ? this.verdict.tone : "good";
    const cardOpts = {
      creatureImg: this.visitor.body, need: card.need || "",
      firstline: card.firstline || card.first_line || "", verdictText, tone,
      taskId: taskPlayed ? taskPlayed.id : "world-only",
    };
    const vidId = this.visitor.vid;
    WorldBridge.renderShareCard(cardOpts).then(png => {
      const gifWait = new Promise(resolve => {
        const tries = [VIDEO_SRC.pop(vidId, "idle"), VIDEO_SRC.agentMove(vidId, "idle")];
        let settled = false;
        const done = r => { if (!settled){ settled = true; resolve(r); } };
        setTimeout(() => done(null), 4000);
        for (const src of tries){
          const v = getVideo(src);
          if (!v) continue;
          const ok = () => done({ src, v });
          if (v.readyState >= 2 && v.videoWidth) ok();
          else { v.addEventListener("canplay", ok, { once: true }); }
        }
      });
      const withGif = gifWait.then(hit => {
        window.__lastGif = { stage: hit ? "hit:" + hit.src : "no-hit" };
        if (!hit) return null;
        const proxy = {
          get videoWidth(){ return hit.v.videoWidth; },
          get videoHeight(){ return hit.v.videoHeight; },
          play(){ return hit.v.play(); }, set currentTime(x){ hit.v.currentTime = x; },
          __draw(){ return keyedFrame(hit.src, hit.v); },
        };
        return WorldBridge.renderShareGif({ ...cardOpts, creatureVideo: proxy })
          .then(g => { window.__lastGif.stage = "ok:" + (g ? g.length : 0); return g; })
          .catch(e => { window.__lastGif.stage = "err:" + e.message; return null; });
      });
      return withGif.then(gif => {
        window.__lastGif.sizes = { png: png.length, gif: gif ? gif.length : 0 };
        return WorldBridge.postResult(id, {
          verdict: { text: verdictText, tone },
          matched: { task_id: taskPlayed ? taskPlayed.id : null },
          card_png: png, ...(gif ? { card_gif: gif } : {}),
        }).then(r => { window.__lastGif.post = String(r); return r; });
      });
    }).catch(e => console.warn("分享卡失敗", e));
    marklayer.onFinish();            // 標示層：記號跟著他走回群眾，然後收起來
    this.visitor.reserved = false; this.visitor.wander = true;
    this.visitor = null; this.visitorId = null; this.visitorCard = null; this.visitorSub = null;
  },
  startChain(){
    // 收據上鏈：這一筆留下什麼證據、憑什麼可以被獨立重驗
    this.mode = "replay_chain"; this.t = 0;
    const s = SCENES.s13;
    const insp = Object.values(byAgent)[0];
    this.enterScene("s13", [[insp, s.slots[0], {dir: -1, act: "lens", k: 1.1}]]);
    this.caption = "這一筆的收據已經接上鏈";
    // B3：印的要是**收據鏈頭**，不是題面雜湊（見 chainBeatSub 的註解）。
    this.capSub = chainBeatSub(this.task);
  },
  startReceipt(){
    // 訪客的結尾：他的分身站在正中央，畫面告訴他「這就是你的結果，收據在你手機」
    this.mode = "visitor_receipt"; this.t = 0;
    const v = this.verdict;
    this.caption = v ? v.big : "他完成了這件事";
    this.capSub = "這張收據正在送到你的手機——可以帶走、可以分享";
    this.finishVisitor(this.visitorTask || null);   // 出卡（非同步）
    if (this.receiptCreature){
      const s13 = SCENES.s13;
      setScene("s13");
      this.stage([[this.receiptCreature, s13.slots[0], { dir: -1, k: 1.15 }]]);
    }
  },
  endReplay(){
    if (this.visitorId) this.finishVisitor(this.visitorTask || null);
    this.visitorTask = null;
    this.verdict = null; this.auditText = null;
    this.caption = ""; this.capSub = "";
    this.caseKind = null;
    this.mode = "ambient"; this.cooldown = 10 + Math.random()*8;
    this.enterScene("s11");
    const s = SCENES.s11;
    cast.forEach((c, i) => { c.onstage = true; c.wander = true; c.reserved = false; c.dim = 0;
      c.acting = null;
      if (s.slots[i]) c.place(s.slots[i][0], s.slots[i][1]); });
    const writers = cast.filter(c => c.agent).slice(0, 3);
    writers.forEach(c => { c.reserved = true; c.acting = "write"; });
  },
};

/* ── 活模式：接真實 Vacant agent 的事件串流 ──────────────────────
   規格：world3/docs/LIVE_INTERFACE.md。?live=<url>[&poll=2000][&state=<url>]
   凍結重放與真跑 agent 吐同一種事件，電視只認事件——換資料源不用改電視。
   沒給 live 參數就是離線重放（展場預設，鐵律：不能假設有網路）。

   ⚠ v2（2026-09-19，忠實度稽核之後）：**這台電視不准替沒跑過的東西作證。**
   底下 LIVE-BEGIN 到 LIVE-END 之間**一行都不碰 canvas**：所有「畫面上要說哪一句
   話」的決定都收在這裡的純函數，繪圖那一側只負責把字印出去。
   理由是可驗證性——`tools/livecheck.mjs` 把這一段整塊抽出來，拿真事件跑一次，
   逐句比對它說了什麼。「話對不對」因此是**可執行的判準**，不是讀 code 讀出來的感想。
   對照表與 P1–P13 的逐條出處：Vacant repo 的
   `decisions/DECISION_20260919_TWIN_V2_FIDELITY.md` §四。 */
const LIVE = { url: Q.get("live"), poll: +(Q.get("poll") || 2000),
               stateUrl: Q.get("state") || null,
               seen: new Set(), seenQ: [], pending: [], counters: null,
               lastErr: null, on: false, stage: null, stageErr: null,
               dropped: [] };

/* === LIVE-BEGIN === 以下到 LIVE-END 之間不碰 DOM／canvas，可整段抽出來單獨測 === */

/** 三值：`true`／`false`／`null`（沒量）。**不准做 `!!`。**
 *
 *  P2／P3（B1／B2）：`!!v.meets_demand` 把 null 壓成 false ⇒ 每一格交付都被電視
 *  宣告成「收了一件其實不合格的東西」＝**憑空捏造一筆隱藏測資失敗**。
 *  誠實邊界逐字寫著：「沒量」與「量到過」不可以在資料上同形。 */
function tri(v){ return (v === null || v === undefined) ? null : !!v; }

/** 事件的去重鍵（電視這一端唯一的身分）。 */
function liveKey(e){ return `${e.ts}|${e.type}|${e.task_id}|${e.arm || ""}|${e.reviewer || ""}`; }

function liveParse(text){
  const out = [];
  for (const line of String(text).split("\n")){
    const t = line.trim();
    if (!t) continue;
    try {
      const j = JSON.parse(t);
      if (Array.isArray(j.events)) out.push(...j.events); else out.push(j);
    } catch(e){}
  }
  return out;
}

/** 去重集合有上限（D3）。
 *
 *  展場是一整天的無人值守循環：`seen` 沒有上限就會一路長大，而每一輪輪詢又要
 *  比對整個集合 ⇒ O(n²)。伺服器保證 ts 單調遞增、重播一定帶新的 ts，
 *  所以丟掉最舊的鍵不會讓舊事件復活。 */
const LIVE_SEEN_MAX = 4000;
function liveRemember(L, k){
  if (L.seen.has(k)) return false;
  L.seen.add(k); L.seenQ.push(k);
  while (L.seenQ.length > LIVE_SEEN_MAX) L.seen.delete(L.seenQ.shift());
  return true;
}

/** 一格從開場到現在，最多容忍幾輪組不起來就放掉（D2）。
 *
 *  `infra_void` 的格子**不簽收據也不發裁決**（`launcher.py:664-665`）。舊版的
 *  `liveAssemble` 只看 `pending[0]`，遇到這種格子就 `return null` ⇒ **整個佇列
 *  從此不再播任何東西**。無人值守的展場不能有這種形狀。
 *  這裡改成：掃過所有 task_id 找收尾了的那一筆；收不了尾的等 N 輪之後放掉，
 *  **並且記在 `L.dropped` 裡**（畫面上說得出「有一格沒收尾」，不是靜靜丟掉）。 */
const LIVE_STALE_ROUNDS = 8;

/** 事件 → 一筆可播的紀錄（形狀與 replay_371 的 task 相同，導演不用改）。
 *
 *  P13：一格現在有 N 筆 `gate_ran`（每次嘗試各一筆）。`visible_ok` 要取
 *  **最後一筆**（與 `verdict` 同一次）。取第一次的閘門結果配上最後一次的裁決，
 *  資料上就長成「驗收沒過 ＋ 收下了」＝ B1 那句紅字的形狀。 */
function liveAssemble(L, wantId){
  L = L || LIVE;
  if (!L.pending.length) return null;
  const order = [];
  for (const e of L.pending) if (order.indexOf(e.task_id) < 0) order.push(e.task_id);
  let tid = null;
  // `wantId`＝手機剛剛按出來的那一格。**它要插隊**：自動輪播可能已經在佇列裡
  // 排了幾格，照順序播的話「按下去到電視有反應」就會變成「按下去，等前面播完」。
  if (wantId && L.pending.some(e => e.task_id === wantId && e.type === "verdict"))
    tid = wantId;
  for (const id of tid ? [] : order){
    if (L.pending.some(e => e.task_id === id && e.type === "verdict")){ tid = id; break; }
  }
  if (tid === null){
    // 沒有任何一格收得了尾：給還沒收尾的那些記一次，超過上限就放掉。
    L.stale = L.stale || {};
    for (const id of order){
      L.stale[id] = (L.stale[id] || 0) + 1;
      if (L.stale[id] > LIVE_STALE_ROUNDS){
        const evs = L.pending.filter(e => e.task_id === id);
        L.pending = L.pending.filter(e => e.task_id !== id);
        delete L.stale[id];
        L.dropped.push({ task_id: id, n: evs.length,
          why: "這一格沒有走到裁決，也沒有收據——沒有收尾的格子不播" });
      }
    }
    return null;
  }
  const evs = L.pending.filter(e => e.task_id === tid);
  L.pending = L.pending.filter(e => e.task_id !== tid);
  if (L.stale) delete L.stale[tid];

  // ⚠ **一格現在有兩串事件**（`arm: "ON"` 與 `arm: "OFF"`）。
  //   不分臂的話 `all("draft_done")` 會把 OFF 那一筆也數進 ON 的嘗試次數。
  //   舊資料沒有 `arm` 欄位 ⇒ 一律當 ON（加資料不准讓現況變壞）。
  const onEvs = evs.filter(e => (e.arm || "ON") === "ON");
  const offEvs = evs.filter(e => e.arm === "OFF");
  const get = t => onEvs.find(e => e.type === t) || {};
  const all = t => onEvs.filter(e => e.type === t);
  const v = get("verdict"), rt = get("routed"), op = get("task_opened");
  const gates = all("gate_ran");
  const gLast = gates.length ? gates[gates.length - 1] : null;   // P13
  const revs = all("revised");
  const au = get("audited");
  const rc = get("receipt");
  const row = {
    worker: rt.worker || null,
    // P11：路由依據照實讀。`random` ＝ 這條路上沒有路由層。
    route_basis: rt.type ? (rt.basis || null) : null,
    route_note: rt.basis_note || "",
    // A1：沒有 `review_vote` 就是**這條路上沒有這一層**，不是 0/0。
    votes: all("review_vote").map(e => [e.reviewer, e.verdict === "pass"]),
    has_review_layer: all("review_vote").length > 0,
    // A2：沒有 `audited` 事件＝沒有抽樣稽核層，不是「沒抽中」。
    has_audit_layer: !!au.type,
    audited: !!au.type, audit_ok: tri(au.ok),
    // C1／P12：重改是**同一個 agent 帶著自己的失敗原文再跑一次**。
    attempts: (get("draft_done").of || all("draft_done").length || 1),
    attempts_used: v.attempts_used ?? null,
    // ⚠ `arm` 與 `retry_arm` 是**兩個不同的東西**（2026-09-19 分開）。
    //   `arm` 現在專職分 ON／OFF；重試臂（revise／resample）搬到 `retry_arm`。
    //   還讀 `arm` 的話這裡會拿到 "ON"，然後重改那一拍會講錯是哪一條臂。
    retry: v.retry || (revs.length ? (revs[0].retry_arm || null) : null),
    revisions: revs.map(e => ({ reviser: e.reviser || null,
                                transition: e.transition || "", attempt: e.attempt })),
    reviser: revs.length ? (revs[revs.length - 1].reviser || null) : null,
    selected_version: revs.length ? "revised" : "initial",
    gates: gates.map(e => ({ passed: tri(e.passed), n_tests: e.n_tests ?? null,
                             failed_case: e.failed_case || null,
                             attempt: e.attempt ?? null, of: e.of ?? null })),
    // ⚠ **被牆鐘上限砍掉**與**自己跑完但沒過**是兩個故事，而兩者的
    //   `stop_reason` 都是 `visible_fail`。不分開的話，畫面會把
    //   「我們沒等它」演成「它做不出來」。
    timed_out: all("draft_done").some(e => e.timed_out === true),
    // ⚠ `feedback_bytes` 在 `file` 管道底下**每一次都是 0**，那不代表沒有回饋。
    feedback_delivery: (all("draft_done").find(e => e.feedback_delivery) || {})
      .feedback_delivery || null,
    visible_ok: gLast ? tri(gLast.passed) : null,
    failed_case: gLast ? (gLast.failed_case || null) : null,
    n_tests: gLast ? (gLast.n_tests ?? null) : null,
    // P2／P3：三值一路保到畫面上。
    accepted: tri(v.accepted),
    meets_demand: tri(v.meets_demand),
    stop_reason: v.stop_reason || null,
    blocked_by: v.blocked_by ?? null,
  };
  return {
    id: tid,
    prompt: op.prompt || "",
    // P4（B3）：題面 sha256 與收據鏈頭是**兩個不同的 hash**，各自帶一份。
    prompt_sha256: op.prompt_sha256 || "",
    chain_head: rc.chain_head || rc.sha256 || "",
    verify_url: rc.verify_url || "",
    // P6（A6／C2）：證據等級逐格跟著事件走，不是橫幅寫死。
    evidence: op.evidence || null,
    evidence_note: op.evidence_note || "",
    stratum: op.stratum || null,
    ON: row,
    // P10（A4）：**反事實那一臂現在真的跑過了**（2026-09-19 傍晚，54 格兩臂全 L-real）。
    // ⚠ 但它**沒有裁決**：那一臂沒有閘門、不簽收據，`accepted` 恆為 null。
    //   唯一能講的是「我們**事後**用同一把尺量」——那是 `postaudit`，
    //   而它自己帶著 `when/is_verdict/signed` 三個旗標。
    //   **不准拿 `postaudit.all_pass` 去填 `accepted`**：那會把「關掉這層」
    //   演成「另一邊也判了」，是 A4 換個方向再犯一次。
    OFF: offRowData(offEvs),
    __live: true,
  };
}

/* ---- 以下全部是「畫面上要說哪一句話」。一句一個純函數，逐句可測。 ---- */

/** P6（A6）：證據等級 → 橫幅。**L-real 才准講「正在發生」。** */
// ⚠ **對觀眾寫「AI」，不要寫「模型」。** 整面畫面都是黏土公仔，
//   「沒有模型參與」在那個畫面上可以讀成「沒有公仔參與」——與我們要講的相反。
// ⚠ 而且左上角只寫「機制模擬」四個字會被推廣成「整個都是假的，連數字也是」，
//   剛好和我們要講的相反。所以標題就把界線畫在對的地方：
//   **真的跑過的是驗收與收據，沒有動手的是 AI。**
const EVIDENCE_BANNER = {
  "L-real":    ["AI 真的動手了",
                "這一筆是真的 AI 做的：它的通道走過 Vacant", "good"],
  "L-fake":    ["AI 沒有動手",
                "通道與閘門是真跑的，站在 AI 位置上的是測試用的假上游", "warn"],
  "L-none":    ["AI 沒有動手",
                "驗收與收據是真的跑過的；交件是一支腳本寫的，不是 AI 寫的", "warn"],
  "L-unknown": ["說不出 AI 有沒有動手",
                "有 AI 通訊，但上游是什麼沒有留下紀錄——不要當成 AI 動手的證據", "warn"],
};
function liveBanner(t){
  const e = t && t.evidence;
  const b = EVIDENCE_BANNER[e];
  if (b) return { title: b[0], sub: b[1], tone: b[2] };
  // 沒有證據等級就**不准講「正在發生」**：講不出來要照實講講不出來。
  return { title: "證據等級沒有跟著事件過來",
           sub: "這一格沒有帶證據等級，所以這台電視說不出它是不是真模型跑的",
           tone: "warn" };
}

/** P6：右下角那一行誠實列。活模式不再寫死「正在發生的真實 agent」。 */
// ⚠ **這一行不准寫死數字，也不准寫死「AI 有沒有參與」。**
//
// 舊版寫的是「這 **18** 格：驗收和收據是真的跑過的；**AI 沒有參與，交件是腳本寫的**」。
// 2026-09-20 量了活模式實際播的那一批（`runs/twin_real_20260919/events.jsonl`）：
// **54 筆、`evidence` 全部 `L-real`**，資料自己的註記逐字是
// 「真模型真跑：模型通道經過 Vacant（`requests_seen > 0`），上游宣告為真模型端點」。
// ⇒ 那句話**格數錯（18 vs 54），而且「AI 沒有參與」是假的**
//   ——還印在觀眾停留最久的待機畫面上。
//
// 理由與 `standbySub` 同一條：**數字與宣稱都要跟真的載進來那一批一致。**
// ⚠ 什麼都沒載進來時**不給數字也不給等級**（鐵律 3：沒量到 ≠ 量到 0）。
// ⚠ 吃參數不讀全域，形狀與 `standbySub(replay, stage)` 一致——**這是為了測得動**。
//   2026-09-20：上一版讀 `LIVE.counters`，於是 `tools/livecheck.mjs` 沒辦法餵它不同狀態，
//   只能斷言一個寫死的字串；那個字串後來被判定為假話而移除 ⇒ livecheck 一載入就
//   `ReferenceError`、**整支閘門死掉、一條檢查都沒跑**（而且沒有人發現）。
//   ⇒ 守「性質」不要守「字串」，而守得動的前提是這個函式純。
function idleHonesty(counters){
  const c = counters && counters.evidence_counts;
  const keys = c ? Object.keys(c) : [];
  const n = c ? keys.reduce((a, k) => a + (c[k] || 0), 0) : null;
  if (!n) return "驗收與收據是真的跑過的 · 畫面上的人是示意";
  if (keys.length === 1 && keys[0] === "L-real")
    return `這 ${n} 格：AI 真的動手了 · 驗收與收據是真的跑過的 · 畫面上的人是示意`;
  if (keys.length === 1 && keys[0] === "L-none")
    return `這 ${n} 格：驗收與收據是真的跑過的；AI 沒有參與，交件是腳本寫的 · 畫面上的人是示意`;
  return `這 ${n} 格：驗收與收據是真的跑過的，AI 有沒有動手逐格不同（看左上角） · 畫面上的人是示意`;
}
function liveHonesty(t){
  // ⚠ 這一行在**每一個畫面**都出現（待機與引導畫面觀眾停最久，那裡以前
  //   只有一句「機制模擬」）。所以它要能單獨讀懂：真的是什麼、假的是什麼。
  if (!t) return idleHonesty(LIVE.counters);
  if (t.evidence === "L-real")
    return "這一格：AI 真的動手了 · 驗收與收據是真的跑過的 · 畫面上的人是示意";
  if (t.evidence === "L-none")
    return "這一格：驗收和收據是真的跑過的；AI 沒有參與，交件是腳本寫的 · 畫面上的人是示意";
  return "這一格：驗收與收據是真的跑過的，AI 有沒有動手見左上角 · 畫面上的人是示意";
}

/** P9（A5／C3）：停止理由的四種形狀，各講各的。**沒有一種是評審。** */
const STOP_TEXT = {
  "visible_pass":       "驗收過了",
  "visible_fail":       "沒過客戶的驗收測資",
  "attempts_exhausted": "改了幾次還是沒過，額度用完",
  "no_suite":           "沒有驗收套件 ⇒ 一律不交付（fail-closed）",
  "ungated":            "沒有量：這一格沒跑驗收",
  // ⚠ 這一條**只有凍結重放（G 實驗）用得到**：那一批真的有評審層。
  //   `vacant run` 這條路上沒有評審，所以活模式永遠走不到這裡。
  "review_reject":      "評審判否（那一批有評審層，判否要附可執行反例）",
};
function stopReasonText(stop){
  if (!stop) return "理由未提供";
  return STOP_TEXT[stop] || `理由未提供（${stop}）`;
}

/** P5／P9：判決那一行。三值一路保到這裡。 */
function verdictRow(row){
  if (row.accepted === null)
    return { text: `沒量（${stopReasonText(row.stop_reason)}）`, tone: null };
  if (row.accepted === false)
    // ⚠ **被時間上限砍掉**與**自己跑完但沒過**是兩個故事，而 `stop_reason`
    //   一樣是 `visible_fail`。混講就是把「我們沒等它」演成「它做不出來」。
    return { text: row.timed_out ? "擋下（時間到，被我們砍掉）"
                                 : `擋下（${stopReasonText(row.stop_reason)}）`,
             tone: "good" };
  if (row.meets_demand === null)
    return { text: "收下 · 有沒有符合需求，沒量", tone: null };
  return row.meets_demand ? { text: "收下 · 符合需求", tone: "good" }
                          : { text: "收下 · 其實漏出", tone: "bad" };
}

/** P5（B1）：判決拍的大字。 */
function verdictBig(row){
  if (row.accepted === null)
    return { big: "沒量——這一格沒有跑驗收", tone: null };
  if (row.accepted === false)
    return { big: row.timed_out ? "擋下了——不過它是跑到時間上限被砍的"
                                : "擋下了", tone: "good" };
  if (row.meets_demand === null)
    return { big: "收下了——過了客戶的驗收測資", tone: "good" };
  return row.meets_demand ? { big: "收下了——而且真的符合需求", tone: "good" }
                          : { big: "收下了——其實不符需求（漏出）", tone: "bad" };
}

/** P5（B1）：「符合需求」那一句的註腳。null ⇒ 講清楚為什麼答不出來。 */
function meetsDemandNote(row){
  if (row.meets_demand !== null) return "隱藏測資判定，從不出現在題目裡";
  return "有沒有符合需求，沒量：那要隱藏測資才答得出來，而隱藏測資不進展件";
}

/** 逾時那幾格的註腳。**不要替它編原因**——為什麼跑那麼久，我們沒有量。 */
function timedOutNote(row){
  if (!row.timed_out) return null;
  return "這一次是跑到時間上限被我們砍掉的，送去驗收的是它寫到一半的工作區"
       + "——它為什麼跑那麼久，我們沒有量，不要猜";
}

/** OFF 那一串事件 → 一個**不是裁決**的物件。
 *
 *  ⚠ 這裡刻意**不提供** `accepted` 以外的布林捷徑：那一臂沒有閘門、不簽收據，
 *  它沒有「判決」這回事。過沒過只有一個來源——`postaudit`，而且它自己說
 *  自己是事後的、非裁決、未簽章。 */
function offRowData(offEvs){
  if (!offEvs || !offEvs.length) return null;
  const v = offEvs.find(e => e.type === "verdict") || {};
  const d = offEvs.find(e => e.type === "draft_done") || {};
  const pa = offEvs.find(e => e.type === "postaudit") || null;
  return {
    ran: true,
    infra_void: v.stop_reason === "infra_void",
    accepted: tri(v.accepted),            // 恆 null——那一臂沒有裁決
    meets_demand: null,
    has_receipt: v.has_receipt === true,  // 恆 false——那一臂不簽收據
    calls_used: d.calls_used ?? null,
    timed_out: d.timed_out === true,
    postaudit: pa ? {
      all_pass: pa.all_pass === true, passed: pa.passed ?? null,
      n_tests: pa.n_tests ?? null, failed_case: pa.failed_case || null,
      when: pa.when || null, is_verdict: pa.is_verdict, signed: pa.signed,
    } : null,
  };
}

/** 事後稽核**能不能拿來講**。三個旗標缺一個就不准印成結果。 */
function postauditUsable(pa){
  return !!(pa && pa.when === "after_the_run"
            && pa.is_verdict === false && pa.signed === false
            && pa.n_tests != null);
}

/** P10（A4）：同題關掉這一層。**null 是「沒跑過」，不是「也擋下」。** */
function offRow(t){
  const off = t && t.OFF;
  if (!off) return { text: "沒有跑過這個對照", tone: null };
  if (off.infra_void) return { text: "那一臂跑掛了，沒量到", tone: null };
  // ⚠ **兩種 OFF 不可以混講。**
  //   凍結重放（G 實驗）的 OFF 臂**真的被判過**（那一批兩臂都有裁決），
  //   所以它照實說「也擋下／也收下」。
  //   twin 的 OFF 臂**沒有閘門、沒有裁決**，`accepted` 恆為 null ——
  //   那一邊唯一能講的是「我們事後用同一把尺量」。
  //   用 `accepted` 有沒有值來分，而不是用模式分：**差別由資料決定**。
  if (off.accepted !== null){
    if (off.accepted === false) return { text: "也擋下", tone: null };
    if (off.meets_demand === null)
      return { text: "收下 · 有沒有符合需求，沒量", tone: null };
    return off.meets_demand ? { text: "也收下 · 符合", tone: null }
                            : { text: "收下 · 漏出", tone: "bad" };
  }
  if (!postauditUsable(off.postaudit))
    return { text: "跑了，但沒有事後量", tone: null };
  const pa = off.postaudit;
  return { text: `事後量 ${pa.passed}/${pa.n_tests} 過`,
           tone: pa.all_pass ? null : "bad" };
}

/** 那一臂**有沒有收據**——展件最核心的那一格差別，值得自己一行。 */
function offReceiptRow(t){
  const off = t && t.OFF;
  if (!off || off.infra_void) return null;
  // 凍結重放的資料沒有記這件事 ⇒ 不要憑空回答（那一批的 OFF 有沒有收據，
  // replay_371 裡查不到）。
  if (off.has_receipt === undefined || off.has_receipt === null) return null;
  return { text: off.has_receipt ? "有" : "沒有（那一臂不簽收據）",
           tone: off.has_receipt ? null : "bad" };
}

function offLine(t){
  const off = t && t.OFF;
  if (!off) return "同一題沒有跑過關掉這層的對照——沒跑過就是沒跑過";
  if (off.infra_void) return "同一題關掉這層那一跑掛了——沒量到就是沒量到";
  if (off.accepted !== null)
    // 凍結重放那一批的 OFF 臂真的被判過，照實比。
    return off.accepted === true && off.meets_demand === false
      ? "同一題沒有那一層的時候：收下了，而且漏出"
      : "同一題沒有那一層的時候，那一邊自己的判決就在左邊那一行";
  if (!postauditUsable(off.postaudit))
    return "同一題關掉這層：它沒有閘門、沒有收據；這一格沒有事後補量";
  const pa = off.postaudit;
  // ⚠ 「事後」兩個字不可以省：那一臂當場沒有判過任何東西。
  return `同一題關掉這層：沒有閘門、沒有收據；我們事後用同一把尺量，`
       + `${pa.passed}/${pa.n_tests} 過`;
}

/** P7（A1／A2）：沒有那一層就說「沒有那一層」。 */
function reviewRow(row){
  if (!row.has_review_layer) return { text: "這條路上沒有這一層", tone: null };
  const pass = row.votes.filter(v => v[1]).length;
  return { text: `${pass}/${row.votes.length} 判可`,
           tone: pass < row.votes.length ? "bad" : null };
}
function auditRow(row){
  // 「這條路上沒有這一層」與「有這一層，這次沒抽中」不是同一件事（A2）。
  if (!row.has_audit_layer) return { text: "這條路上沒有這一層", tone: null };
  if (!row.audited) return { text: "沒抽中", tone: null };
  return { text: row.audit_ok ? "抽中 · 重跑通過" : "抽中 · 重跑不符",
           tone: row.audit_ok ? "good" : "bad" };
}

/** P12（C1）：重改那一拍。**同一個 agent 帶著自己的失敗原文再跑一次。** */
function reviseBeat(row){
  const rv = row.revisions[0];
  if (!rv) return null;
  const arm = row.retry || "";
  // ⚠ `feedback_delivery` 決定回饋**走哪一條管道**。`file` 底下
  //   `feedback_bytes` 每一次都是 0——那不代表沒有回饋，代表回饋在檔案裡，
  //   而它有沒有去讀是另一回事（R535 量過檔案這條管道在 wire 上零命中）。
  const via = row.feedback_delivery === "prompt"
      ? "把失敗原文接在下一次的題目後面"
      : row.feedback_delivery === "both"
        ? "把失敗原文寫進 VACANT_FEEDBACK.md，同時接在題目後面"
        : "把失敗原文寫進工作區的 VACANT_FEEDBACK.md（它有沒有去讀是另一回事）";
  const how = arm === "resample"
    ? "工作區重置回起點、不給失敗原文，同一個 agent 重跑一次"
    : arm === "revise"
      ? `${via}，同一個 agent 再跑一次`
      : (rv.transition || "同一個 agent 再跑一次");
  return { caption: "閘門擋下 → 把失敗原文給它 → 它自己再跑一次",
           sub: `${rv.reviser || row.worker}：${how}`,
           transition: rv.transition || "" };
}

/** P8（A1）：沒有評審層的時候，s07 演的是**閘門**——那才是 Vacant 這條路上
 *  第 7 拍真正發生的事（`gate_ran`，LIVE_INTERFACE.md 稱它「主戲」）。
 *  不是「跳過一拍」，是「把憑空多出來的那一層換成真的那一層」。 */
function gateBeat(row){
  const g = row.gates.length ? row.gates[row.gates.length - 1] : null;
  if (!g) return { caption: "這一格沒有跑驗收",
                   sub: "沒有驗收套件就不交付（fail-closed）——沒量不等於量了沒過" };
  const n = g.n_tests == null ? "" : `${g.n_tests} 條`;
  if (g.passed === true)
    return { caption: `跑客戶的驗收測資：${n}全過`,
             sub: "這條路上沒有同儕評審：交付物直接進閘門，過了才交付" };
  return { caption: `跑客戶的驗收測資：${g.failed_case || "有一條"}沒過`,
           sub: "這條路上沒有同儕評審：擋下來的是閘門，不是某一個人" };
}

/** P1（D1）：找不到那個名字的造型怎麼辦。**絕不靜靜丟掉。**
 *
 *  `byAgent` 的鍵是寫死的六個原型名（careful-1/2、plain-1/2、hasty-1/2），
 *  而 twin 的居民叫 DUL-89／KAL-52／LIV-51（`roster.py` 程序生成）⇒ 舊版
 *  `byAgent[lt.ON.worker]` 恆為 undefined，而 `liveAssemble` 已經先把事件刪掉了
 *  ⇒ 每一筆被靜靜丟棄、畫面毫無反應、主控台沒有半個字。
 *
 *  改法：名字對不上就**借一個空著的造型**，而且畫面上用**真名**。
 *  回傳 `{ key, borrowed }`；`key` 是 `byAgent` 裡的鍵，`borrowed` 說這是借的。 */
function castKeyFor(worker, keys, taken){
  if (!worker) return null;
  if (keys.indexOf(worker) >= 0) return { key: worker, borrowed: false };
  const free = keys.filter(k => !taken || !taken[k]);
  const pool = free.length ? free : keys;
  if (!pool.length) return null;
  // 確定性：同一個名字永遠借到同一個造型（同一位居民不會每次換臉）。
  let h = 0;
  for (let i = 0; i < worker.length; i++) h = (h * 31 + worker.charCodeAt(i)) >>> 0;
  return { key: pool[h % pool.length], borrowed: true };
}

/** 同步 SHA-256（ASCII 輸入）。**刻意不用 `crypto.subtle`**：那支是非同步的，
 *  而記號要在 canvas 的每一格畫出來；而且它在非安全脈絡（file:// 直開的離線頁）
 *  不存在——展場的紅線是離線可跑。 */
function ttSha256(ascii){
  var i, j, n = ascii.length, bytes = new Array(n);
  for (i = 0; i < n; i++){
    var c = ascii.charCodeAt(i);
    if (c > 127) return null;                 // 非 ASCII ⇒ 不是不透明 id，拒算
    bytes[i] = c;
  }
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  var bitLen = n * 8;
  for (i = 0; i < 4; i++) bytes.push(0);
  bytes.push((bitLen >>> 24) & 255, (bitLen >>> 16) & 255, (bitLen >>> 8) & 255, bitLen & 255);
  var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,
           0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var w = new Array(64);
  for (i = 0; i < bytes.length; i += 64){
    for (j = 0; j < 16; j++){
      w[j] = (bytes[i+j*4] << 24) | (bytes[i+j*4+1] << 16)
           | (bytes[i+j*4+2] << 8) | bytes[i+j*4+3];
    }
    for (j = 16; j < 64; j++){
      var x = w[j-15], y = w[j-2];
      var s0 = ((x >>> 7) | (x << 25)) ^ ((x >>> 18) | (x << 14)) ^ (x >>> 3);
      var s1 = ((y >>> 17) | (y << 15)) ^ ((y >>> 19) | (y << 13)) ^ (y >>> 10);
      w[j] = (w[j-16] + s0 + w[j-7] + s1) | 0;
    }
    var a=H[0],b=H[1],c2=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for (j = 0; j < 64; j++){
      var S1 = ((e >>> 6)|(e << 26)) ^ ((e >>> 11)|(e << 21)) ^ ((e >>> 25)|(e << 7));
      var ch = (e & f) ^ (~e & g);
      var t1 = (h + S1 + ch + TT_K[j] + w[j]) | 0;
      var S0 = ((a >>> 2)|(a << 30)) ^ ((a >>> 13)|(a << 19)) ^ ((a >>> 22)|(a << 10));
      var mj = (a & b) ^ (a & c2) ^ (b & c2);
      var t2 = (S0 + mj) | 0;
      h=g; g=f; f=e; e=(d + t1)|0; d=c2; c2=b; b=a; a=(t1 + t2)|0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c2)|0; H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  var out = new Array(32);
  for (i = 0; i < 8; i++){
    out[i*4] = (H[i] >>> 24) & 255; out[i*4+1] = (H[i] >>> 16) & 255;
    out[i*4+2] = (H[i] >>> 8) & 255; out[i*4+3] = H[i] & 255;
  }
  return out;
}
/** 不透明 id → 記號 `{word,color,colorHex,shape,label}`；對不上白名單回 `null`。
 *  ⚠ 回 `null` 不是回一個空記號——畫面上「沒有記號」與「記號是空白」是兩件事，
 *  後者會讓觀眾站在螢幕前找一個不存在的東西。 */
function twinToken(subId){
  if (typeof subId !== "string" || !TT_ID_RE.test(subId)) return null;
  var h = ttSha256(TT_SPEC + "|" + subId);
  if (!h) return null;
  var w = TT_WORDS[(((h[0] << 16) | (h[1] << 8) | h[2]) >>> 0) % TT_WORDS.length];
  var c = TT_COLORS[h[3] % TT_COLORS.length];
  var s = TT_SHAPES[h[4] % TT_SHAPES.length];
  return { spec: TT_SPEC, word: w, color: c[0], colorHex: c[1], shape: s,
           label: w + " · " + c[0] + s };
}
/** 記號的形狀畫在任何 2D context 上。**手機與電視用的是這同一支**——
 *  「兩邊是同一個記號」因此不只是資料相同，連畫出來的形也是同一段碼畫的。 */
function twinShapePath(g, x, y, r, shape){
  g.beginPath();
  var i, a;
  if (shape === "圓"){ g.arc(x, y, r, 0, Math.PI*2); }
  else if (shape === "三角"){
    for (i = 0; i < 3; i++){ a = -Math.PI/2 + i*Math.PI*2/3;
      g[i ? "lineTo" : "moveTo"](x + Math.cos(a)*r, y + Math.sin(a)*r*1.04); }
    g.closePath();
  }
  else if (shape === "方"){
    var q = r*0.80, rr = r*0.20;
    g.moveTo(x-q+rr, y-q);
    g.arcTo(x+q, y-q, x+q, y+q, rr); g.arcTo(x+q, y+q, x-q, y+q, rr);
    g.arcTo(x-q, y+q, x-q, y-q, rr); g.arcTo(x-q, y-q, x+q, y-q, rr);
    g.closePath();
  }
  else if (shape === "菱"){
    g.moveTo(x, y-r); g.lineTo(x+r*0.78, y); g.lineTo(x, y+r); g.lineTo(x-r*0.78, y);
    g.closePath();
  }
  else if (shape === "星"){
    for (i = 0; i < 10; i++){
      a = -Math.PI/2 + i*Math.PI/5;
      var rad = (i % 2) ? r*0.44 : r;
      g[i ? "lineTo" : "moveTo"](x + Math.cos(a)*rad, y + Math.sin(a)*rad);
    }
    g.closePath();
  }
  else if (shape === "花"){
    for (i = 0; i < 6; i++){
      a = i*Math.PI/3;
      g.moveTo(x + Math.cos(a)*r*0.52 + r*0.48, y + Math.sin(a)*r*0.52);
      g.arc(x + Math.cos(a)*r*0.52, y + Math.sin(a)*r*0.52, r*0.48, 0, Math.PI*2);
    }
  }
  else if (shape === "月"){
    g.arc(x + r*0.12, y, r, Math.PI*0.42, Math.PI*1.58, false);
    g.arc(x - r*0.36, y, r*0.94, Math.PI*1.48, Math.PI*0.52, true);
    g.closePath();
  }
  else {   // 葉
    g.moveTo(x, y-r);
    g.quadraticCurveTo(x+r*0.92, y-r*0.22, x, y+r);
    g.quadraticCurveTo(x-r*0.92, y-r*0.22, x, y-r);
    g.closePath();
  }
}
/** 記號徽章：一枚有厚度的黏土章。`alpha` 給退役時的淡出用。 */
function twinDrawGlyph(g, x, y, r, tok, alpha){
  if (!tok) return;
  var a = (alpha === undefined) ? 1 : alpha;
  g.save();
  g.globalAlpha = a;
  g.translate(0, r*0.09);
  g.fillStyle = "rgba(0,0,0,0.42)";              // 黏土的接觸影
  twinShapePath(g, x, y, r, tok.shape); g.fill();
  g.translate(0, -r*0.09);
  g.fillStyle = tok.colorHex;
  twinShapePath(g, x, y, r, tok.shape); g.fill();
  g.lineWidth = Math.max(1, r*0.13);             // 奶油色描邊：暗場上才咬得住
  g.strokeStyle = "rgba(244,236,222,0.92)";
  twinShapePath(g, x, y, r, tok.shape); g.stroke();
  g.restore();
}
