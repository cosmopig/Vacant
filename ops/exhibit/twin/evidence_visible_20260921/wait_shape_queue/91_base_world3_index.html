/** 訪客的公開標籤：只給**代號＋類別**，絕不印觀眾自己打的原話。
 *
 *  DECISION_20260921_TWIN_CONSENT_AND_ERASURE §三-3、人動物園 §5.1-2（只取
 *  類別不取內容）＋ §5.1-9（旁觀者也是互動者——公共大螢幕的觀眾不是只有
 *  打字的那個人）。類別沿用 `pickCastFor` 已經在用的 shape/color/texture——
 *  那本來就是分身的**造型**分類，不是需求內容，所以拿來當類別不會反過來
 *  洩漏原文。
 *  ⚠ 人形保留——這支不動 `pickCastFor` 挑造型的邏輯，只是把同一組欄位
 *  拿來拼一句**看得懂但不含原文**的說明字。
 *
 *  🔴 2026-09-21 改：代號從「來客NNN」換成 `twinToken()` 的**三字詞**。
 *     舊版是這一頁自己算的 `h % 1000`，**手機端算不出同一個值**——
 *     觀眾手上沒有那個號碼，螢幕上印它等於沒印。現在兩邊跑的是
 *     `ops/exhibit/twin/twintoken.py` 產生的同一段碼（上面那個 TWINTOKEN 區塊），
 *     `twintoken.py --check` 是那條等式的閘門。`visitorCode` 的**呼叫端一個字沒改**
 *     （`arrivals.arrive()` 與 `visitorLabel` 照舊）。 */
function visitorCode(visitorId){
  if (!visitorId) return null;
  const tok = twinToken(String(visitorId));
  return tok ? tok.word : null;   // 對不上不透明 id ⇒ null，不生一個假代號
}
function visitorMark(visitorId){
  return visitorId ? twinToken(String(visitorId)) : null;
}
function visitorCategory(card){
  card = card || {};
  const bits = [card.shape, card.color, card.texture].filter(Boolean);
  return bits.length ? bits.join("／") : null;
}
function visitorLabel(card, visitorId){
  const code = visitorCode(visitorId);
  const cat = visitorCategory(card);
  if (code && cat) return `${code} · ${cat}`;
  if (code) return code;
  if (cat) return cat;
  return "一位來客";
}

/* ══════════════════════════════════════════════════════════════════════
   標示層（MARK）——「螢幕上那一群黏土人裡，哪一個是我？」

   這一層解的是展場動線上一個會讓前面所有工白做的洞：觀眾投完卡、抬頭，
   螢幕上十幾個黏土人，**他認不出哪一隻是他**。認不出來，提示詞、貼回、
   生成、上鏈、收據全部沒有著力點。

   做法是三件事，缺一不可：

   1. **同一個記號**（`twinToken`）。手機上有、螢幕上也有，而且是同一段碼
      算的（TWINTOKEN 區塊）。它是**詞＋顏色＋形狀**，不是 UUID 片段——
      三公尺外看得清、記得住、講得出口（展場沒有解說員）。
   2. **他的那一隻看得出來**：頭上一塊陶牌寫著記號、腳下一圈記號顏色的光、
      其他地方壓暗（`drawSpot`）、鏡頭往他那邊**推近**（`camera()`）。
   3. **結束有形狀**（人動物園 §5.1-7、Hollanek 2024 建議 1）。演完不是
      「啪一聲消失」——記號跟著他走回群眾，`TT_RETIRE_SECONDS` 秒之內縮小、
      變暗，最後印一句「記號收起來了」才不見。之後**不再重演**
      （DECISION_20260921_TWIN_EXHIBIT_OPEN_RULINGS §二-4b）。

   ⚠ **這一層不碰任何共用狀態。** 不寫 `Creature.dim`（那是 `director.stage`
     在用的欄位，兩邊搶會讓群眾在別的場景莫名其妙變暗）、不改 `spawnQueue`、
     不改 `pickCastFor`。壓暗是**畫上去的一層漸層**，不是改別人的欄位。
   ⚠ **鏡頭只放大不平移**（`camera()` 的 `k >= 1`）。平移會把板的邊緣拉進畫面
     （s0x 那幾張板只有 3% 餘裕，1920×1080 實跑已經抓過兩次撞版）；
     以畫面內任一點為心、倍率 ≥1 的縮放**數學上不可能露出邊**。
     焦點另外夾在 x∈[0.44,0.56]、y∈[0.46,0.60]，免得右下角那塊投遞口陶牌被推出畫面
     ——這條是量過的（見 `evidence_visible_20260921/mark_token/`），不是估的。

   負控制：`?mark=0` 整層關掉（記號、光圈、壓暗、鏡頭全部沒有）⇒ 畫面回到
   改動前：一群黏土人，觀眾沒有任何辦法知道哪一個是他。`?markcam=0` 只關鏡頭。
   ══════════════════════════════════════════════════════════════════════ */
/** 讀網址參數，但**不假設 `Q` 存在**。
 *  🔴 這不是防禦性潔癖，是一次真的把鄰線閘門打死的回歸：`tools/livecheck.mjs`
 *  把 LIVE-BEGIN～LIVE-END 整段抽進 `vm` 沙箱跑，那個沙箱裡**沒有 `Q`、沒有
 *  `location`**（它只餵 JSON/Math/Number/... 那幾個）。這兩行原本直接寫
 *  `Q.get(...)`，於是整段一 import 就 `ReferenceError: Q is not defined`
 *  ——157 條檢查**一條都沒跑**、退出碼 1。那正是 340feaf 修過的同一個病
 *  （「整道閘門從 73d7562 起就是死的」）的第二次。
 *  `typeof Q` 對**未宣告**的識別字回 "undefined" 而不丟例外，所以這支在瀏覽器
 *  （`Q` 宣告在本檔 L40，早於此處，不在 TDZ）與沙箱裡都拿得到正確答案。 */
function markParam(name){
  try {
    if (typeof Q !== "undefined" && Q && typeof Q.get === "function") return Q.get(name);
  } catch (_e){ /* 沙箱／非瀏覽器：當作沒給參數 */ }
  return null;
}
const MARK_ON  = markParam("mark") !== "0";
const MARK_CAM = MARK_ON && markParam("markcam") !== "0";
const MARK_HINT = "手機上同一個記號";

const marklayer = {
  cur: null,          // {cr, tok, seq, t, id} —— 台上這一位
  retiring: [],       // 謝幕中（§5.1-7）
  n: 0,               // 這一輪第幾位上台。**不是「今天第幾位」**——這一頁開著的期間。
  spot: 0,            // 聚光 0..1
  camX: 0.5, camY: 0.52, camK: 1,

  /** `director.startVisitor` 叫它。拿不到記號（id 不是不透明 id）就不標——
   *  標一個算不出來的東西比不標更糟：觀眾會去找一個螢幕上沒有的記號。 */
  onStart(sub, cr){
    if (!MARK_ON || !cr) return;
    const id = (sub && sub.id != null) ? String(sub.id) : "";
    const tok = twinToken(id);
    this.n++;
    this.cur = { cr, tok, seq: this.n, t: 0, id };
    return tok;
  },

  /** `director.finishVisitor` 叫它。記號不隨人走，它**慢慢收起來**。 */
  onFinish(){
    if (!MARK_ON) return;
    const c = this.cur;
    this.cur = null;
    if (!c || !c.tok || !c.cr) return;
    c.t = 0;
    this.retiring.push(c);
    while (this.retiring.length > 3) this.retiring.shift();   // 無人值守一整天不長大
  },

  pos(cr){ return [(cr._qx != null ? cr._qx : cr.nx) * W,
                   (cr._qy != null ? cr._qy : cr.ny) * H]; },
  scaleOf(cr){ return depthScale(cr._qy != null ? cr._qy : cr.ny)
                    * (scene().k || 1) * (cr.kscale || 1); },
  /** 台上那一位「已經成形、而且這一景有他」才算亮著。 */
  live(){
    const c = this.cur;
    return (c && c.tok && c.cr && c.cr.onstage && c.cr.spawning <= 0) ? c : null;
  },

  update(dt){
    if (!MARK_ON) return;
    // 🔴 導演換人了但 `onFinish` 沒被叫到 ⇒ 記號會**永遠亮在一個已經回到群眾裡的人
    //    頭上**。這不是假設：`finishVisitor` 有一條提前 return
    //    （`!this.visitor || !this.visitorId || !window.WorldBridge`）根本走不到
    //    掛鉤那一行。所以不要相信掛鉤一定會來——每一格對一次真相。
    if (this.cur && director.visitor !== this.cur.cr) this.onFinish();
    if (this.cur) this.cur.t += dt;
    for (const r of this.retiring) r.t += dt;
    this.retiring = this.retiring.filter(r => r.t < TT_RETIRE_SECONDS);
    const c = this.live();
    const want = c ? 1 : 0;
    this.spot += (want - this.spot) * Math.min(1, dt * (c ? 1.9 : 2.6));
    let fx = 0.5, fy = 0.52;
    if (c){
      const p = this.pos(c.cr);
      fx = Math.max(0.44, Math.min(0.56, p[0] / W));
      fy = Math.max(0.46, Math.min(0.60, p[1] / H));
    }
    this.camX += (fx - this.camX) * Math.min(1, dt * 1.1);
    this.camY += (fy - this.camY) * Math.min(1, dt * 1.1);
    this.camK = 1 + 0.035 * this.spot;
  },

  /** 鏡頭：只放大、不平移（見上面的 ⚠）。關掉就回 `null`，不回 `{k:1}`——
   *  「沒有鏡頭層」與「鏡頭層在但倍率 1」在除錯時是兩件事。 */
  camera(){
    if (!MARK_CAM || this.camK <= 1.0005) return null;
    return { x: this.camX, y: this.camY, k: this.camK };
  },

  /** 壓暗：畫在**群眾之後、場景道具與投遞口之前**。畫在最後會把右下角那塊
   *  陶牌一起壓暗（它離訪客很遠），那是別條線的東西，不准被我這層弄糊。 */
  drawSpot(){
    if (!MARK_ON || this.spot <= 0.015) return;
    const c = this.live();
    if (!c) return;
    const p = this.pos(c.cr), sc = this.scaleOf(c.cr);
    const bodyH = H * 0.30 * sc;
    const cyy = p[1] - bodyH * 0.45;
    // ⚠ 內半徑不可以給 0 以外的值再配單一 stop：那會在 r0 上留一圈**看得見的
    //   硬邊**（1920×1080 實跑抓到，像畫面上多了一個透明圓盤）。從 0 開始、
    //   中間多兩個 stop，落差才是連續的。
    const r1 = bodyH * 3.2;
    const g = cx.createRadialGradient(p[0], cyy, 0, p[0], cyy, r1);
    const a1 = (0.72 * this.spot);
    g.addColorStop(0.00, "rgba(6,4,1,0)");
    g.addColorStop(0.34, "rgba(6,4,1," + (a1 * 0.05).toFixed(3) + ")");
    g.addColorStop(0.62, "rgba(6,4,1," + (a1 * 0.48).toFixed(3) + ")");
    g.addColorStop(1.00, "rgba(6,4,1," + a1.toFixed(3) + ")");
    cx.save();
    cx.fillStyle = g;
    cx.fillRect(-W, -H, W * 3, H * 3);      // 漸層外側吃最後一個 stop ⇒ 整面壓暗
    cx.restore();
    // 腳下的光圈：顏色＝**記號的顏色**，所以「腳下那圈光」本身也是記號的一部分
    const pulse = 0.82 + 0.18 * Math.sin(c.t * 2.1);
    cx.save();
    cx.globalCompositeOperation = "lighter";
    cx.globalAlpha = 0.46 * this.spot * pulse;
    cx.strokeStyle = c.tok.colorHex;
    cx.lineWidth = Math.max(1.5, bodyH * 0.038);
    cx.beginPath();
    cx.ellipse(p[0], p[1], bodyH * 0.40, bodyH * 0.075, 0, 0, 7);
    cx.stroke();
    cx.globalAlpha = 0.16 * this.spot * pulse;
    cx.fillStyle = c.tok.colorHex;
    cx.beginPath();
    cx.ellipse(p[0], p[1], bodyH * 0.40, bodyH * 0.075, 0, 0, 7);
    cx.fill();
    cx.restore();
    cx.globalAlpha = 1;
  },

  /** 陶牌本體。畫在最上面（投遞口之後）——它是整個動線的答案，不准被蓋住。 */
  draw(){
    if (!MARK_ON) return;
    for (const r of this.retiring){
      const p = Math.min(1, r.t / TT_RETIRE_SECONDS);
      const a = p < 0.55 ? 1 : Math.max(0, 1 - (p - 0.55) / 0.45);
      this.plate(r, a, 0.74 + 0.26 * a, p > 0.62 ? TT_RETIRE_TEXT : MARK_HINT);
    }
    const c = this.live();
    if (c){
      const pop = Math.min(1, c.t / 0.45);
      const s = pop < 1 ? (0.62 + 0.48 * pop - 0.10 * Math.sin(pop * Math.PI)) : 1;
      this.plate(c, 1, s, MARK_HINT);
    }
  },

  plate(e, alpha, kscale, hint){
    const cr = e.cr, tok = e.tok;
    if (!cr || !cr.onstage || !tok || alpha <= 0.012) return;
    const p = this.pos(cr), sc = this.scaleOf(cr);
    const bodyH = H * 0.30 * sc;
    const U = uiScale();
    const k = (0.82 + 0.18 * sc) * kscale;
    const gr = U * 0.0285 * k;                       // 記號半徑（1920 寬 ⇒ 約 62px 直徑）
    const fWord = serif(U * 0.050 * k, 700);
    const fHint = serif(U * 0.0185 * k, 600);
    cx.save();
    cx.font = fWord; const tw = cx.measureText(tok.word).width;
    cx.font = fHint;
    // ⚠ 「第 N 位**上台**」不是「第 N 位投卡」。投遞口那塊陶牌數的是抵達，
    //   這裡數的是上台，而佇列是「新的先演」（裁決 §二-2）⇒ 兩個數會不一樣。
    //   不把差別寫進字面上，觀眾會以為其中一個數錯了。
    const seqTxt = "這一輪第 " + e.seq + " 位上台";
    const hintTxt = seqTxt + " · " + hint;
    const hw = cx.measureText(hintTxt).width;
    cx.restore();
    const padX = U * 0.019 * k, gap = U * 0.013 * k;
    const pw = Math.max(padX * 2 + gr * 2 + gap + tw, padX * 2 + hw);
    const ph = U * 0.108 * k;
    const stemH = U * 0.040 * k;   // 牌子離頭頂遠一點，免得壓在後排那隻臉上
    // 頭頂上方；夾在畫面裡（含 markcam 放大之後的餘裕，所以留 2% 邊）
    const anchorY = p[1] - bodyH * 1.02;
    // 右邊界：世界監視器在的時候，牌子不准壓到它（1920×1080 實跑看到只差幾 px
    // 就撞上）。`monitorGeom` 的 x 不吃列數，所以拿它當**單一真相來源**問一次，
    // 不要在這裡重抄 `W*0.255` 那條式子。
    const monOn = director.mode.indexOf("replay") === 0
               || director.mode === "visitor_receipt";
    const rightMax = (monOn && typeof monitorGeom === "function")
      ? monitorGeom(1, W, H, 0).x - U * 0.014 : W - U * 0.020;
    const px = Math.max(U * 0.020, Math.min(rightMax - pw, p[0] - pw / 2));
    const py = Math.max(U * 0.020, anchorY - stemH - ph);

    cx.save();
    cx.globalAlpha = alpha;
    // 引線：從牌子底下垂到頭頂，末端一個小點——「是這一隻，不是旁邊那隻」
    cx.strokeStyle = "rgba(244,236,222,0.62)";
    cx.lineWidth = Math.max(1, U * 0.0016 * k);
    cx.beginPath();
    cx.moveTo(px + pw / 2, py + ph);
    cx.lineTo(p[0], anchorY);
    cx.stroke();
    cx.fillStyle = tok.colorHex;
    cx.beginPath(); cx.arc(p[0], anchorY, Math.max(1.5, U * 0.0042 * k), 0, 7); cx.fill();
    // 牌子：暗陶底＋奶油描邊（跟監視器／投遞口同一套語言）
    cx.shadowColor = "rgba(0,0,0,0.55)"; cx.shadowBlur = U * 0.010 * k;
    cx.fillStyle = "rgba(14,9,4,0.86)";
    cx.strokeStyle = "rgba(244,236,222,0.52)";
    cx.lineWidth = Math.max(1, U * 0.0018 * k);
    cx.beginPath(); cx.roundRect(px, py, pw, ph, U * 0.011 * k);
    cx.fill(); cx.shadowBlur = 0; cx.stroke();
    // 記號本體：跟手機上同一支 `twinDrawGlyph` 畫的
    const rowY = py + U * 0.039 * k;
    twinDrawGlyph(cx, px + padX + gr, rowY, gr, tok, 1);
    cx.textAlign = "left"; cx.textBaseline = "middle";
    cx.font = fWord; cx.fillStyle = "rgba(246,239,226,0.98)";
    cx.fillText(tok.word, px + padX + gr * 2 + gap, rowY + U * 0.002 * k);
    cx.font = fHint; cx.fillStyle = "rgba(240,232,216,0.62)";
    cx.fillText(hintTxt, px + padX, py + ph - U * 0.023 * k);
    cx.restore();
    cx.globalAlpha = 1; cx.textBaseline = "alphabetic"; cx.shadowBlur = 0;
    // 併排圖要把這塊牌子圈起來。**量出來的**，不是對著截圖用眼睛猜。
    if (alpha > 0.9) this.lastPlate = { x: px, y: py, w: pw, h: ph };
  },
  lastPlate: null,
};
/* MARK-LAYER-V1 END */

/** 世界監視器「這一筆」那一塊的每一列。活模式與凍結重放共用同一份判準。 */
function monitorRows(t, counters, totals){
  const row = t.ON;
  const rows = [];
  // 證據等級擺第一行：它決定底下每一行要怎麼讀（是真模型跑出來的，
  // 還是機制模擬）。放最後面等於讓人先讀完數字才知道那些數字是什麼。
  const ev = evidenceRow(t);
  rows.push({ k: "證據等級", v: ev.text, tone: ev.tone });
  rows.push({ k: "任務", v: String(t.id).replace("mbppplus_", ""), tone: null });
  rows.push({ k: "交給誰", v: row.worker || "—", tone: null });
  const rv = reviewRow(row); rows.push({ k: "同儕評審", v: rv.text, tone: rv.tone });
  const ar = auditRow(row);  rows.push({ k: "抽樣稽核", v: ar.text, tone: ar.tone });
  // P4（B3）：題面雜湊與收據鏈頭拆成兩行。一個欄位不准當兩種 hash 用。
  rows.push({ k: "題面雜湊", v: (t.prompt_sha256 || "").slice(0, 12) || "—", tone: null });
  rows.push({ k: "收據鏈頭", v: (t.chain_head || "").slice(0, 12) || "—", tone: null });
  if (row.gates.length > 1)
    rows.push({ k: "嘗試次數", v: `${row.gates.length} 次（閘門讀最後一次）`, tone: null });
  const vr = verdictRow(row); rows.push({ k: "判決", v: vr.text, tone: vr.tone });
  const or = offRow(t);       rows.push({ k: "同題關掉這層", v: or.text, tone: or.tone });
  const rr = offReceiptRow(t);
  if (rr) rows.push({ k: "關掉這層有收據嗎", v: rr.text, tone: rr.tone });
  if (row.timed_out)
    rows.push({ k: "這一次", v: "跑到時間上限被砍掉", tone: null });
  // 累計漏出：活模式讀 counters 事件；凍結重放用它自己從 371 筆算出來的真值。
  // ⚠ 兩邊都給不出來就印「—」。**不准拿一個當另一個用**，也不准填 0——
  //   「沒量」與「量到 0」不是同一件事（B2 的同一條）。
  const C = counters, T = totals || {};
  const on  = C ? C.on_leaked  : T.leaked;
  const off = C ? C.off_leaked : T.offLeaked;
  // ⚠ 佔位符不要用「—」：在展場的襯線字體上它跟中文數字「一」幾乎一樣，
  //   實測有人把「開 — · 關 —」讀成「開 一 · 關 一」，
  //   而 OFF 臂一格都沒跑過 ⇒ 那是一個憑空生出來的數字。
  const noData = "沒量";
  rows.push({ k: "累計漏出", v: `開 ${on ?? noData} · 關 ${off ?? noData}`,
              tone: (on || off) ? "bad" : null });
  return rows;
}

/** 把一段字依「量得到的寬度」折行。CJK 沒有空白，所以逐字折。
 *
 *  ⚠ 為什麼需要這個：舊版左上角那個框的寬度**只量標題**，說明那一行卻直接
 *  畫在框外面 ⇒ 1920×1080 實測，`這一格沒有模型參與：…` 從 x≈75 一路延伸，
 *  被置中的大標「這一份沒有交出去」整個蓋住，後半段讀不到。
 *  **那一行就是證據等級的誠實宣告，看不完整等於沒講。**
 *  寬度量測由呼叫端注入（canvas 的 measureText），所以這一支是純函數。 */
function wrapByWidth(text, maxW, measure){
  const out = [];
  let cur = "";
  for (const ch of String(text == null ? "" : text)){
    if (ch === "\n"){ if (cur) out.push(cur); cur = ""; continue; }
    const next = cur + ch;
    if (cur && measure(next) > maxW){ out.push(cur); cur = ch; }
    else cur = next;
  }
  if (cur) out.push(cur);
  return out;
}

/** 監視器面板的幾何。**s06 的「開／關」橢圓標要靠它避開面板。**
 *
 *  ⚠ 實測撞版：面板在 x 1398–1887、y 124–474（1920×1080、9 列），
 *  而「開」那個橢圓寫死在 (0.80W, 0.42H) ＝ (1536, 453) ⇒ 直接壓在
 *  「同題關掉這層」與「累計漏出」兩行上面。兩邊各自寫一組座標遲早會分岔，
 *  所以幾何只有這一份。 */
const EVIDENCE_NOTE_MAX_LINES = 3;
function monitorGeom(nRows, W, H, nNote){
  const w = W * 0.255, pad = H * 0.022, line = H * 0.0295;
  const note = nNote ? H * 0.014 + nNote * H * 0.023 : 0;
  return { x: W - w - H * 0.03, y: H * 0.115, w,
           h: pad + line * (nRows + 1.25) + note };
}

/** 右上徽章＝**資料從哪來**，不是證據等級。
 *
 *  ⚠ 證據等級已經在監視器裡講一次、在左上角大框裡講一次；徽章再講一次，
 *  1920×1080 實測就是左上角同時出現兩個「機制模擬」。
 *  而且徽章**不准講「連線中／正在發生」那類暗示即時性的話**：
 *  事件流是活的，但每一格都是先跑完、簽好章的。兩件事不一樣。 */
function sourceBadge(isLive){
  return isLive ? "真紀錄 · 事件流" : "真紀錄重放";
}

/* ── 分身從哪裡來：本機優先，公網是退路 ────────────────────────────
 *
 *  2026-09-20 補上的最後一哩（離線紅線，CLAUDE.md 展場硬約束 2）。
 *  舊版 `bridge.js` **只認公網** ⇒ 公網一斷，電視就沒有新分身。
 *  現在來源是一條有序鏈（見 `bridge.js` 檔頭）：
 *
 *      store（twinlink serve 唯讀端點）→ snapshot（export 落盤快照）→ cloud（公網）
 *
 *  ⚠ 這幾個函式**吃參數不讀全域**，跟 `standbySub`／`idleHonesty` 同一條理由：
 *    讀全域就測不動，測不動的誠實宣告遲早會變成一句沒人更新的假話
 *    （2026-09-20 `IDLE_HONESTY` 那一次就是這樣把整支 livecheck 弄死的）。
 *  ⚠ **「沒量到」不是 0。** `lastOkAt` 是 `null` ＝從頭到尾沒讀成功過，
 *    這時候畫面不准給秒數（給了就是編一個「斷了 0 秒」出來）。 */
const TWIN_SOURCE = {
  store:    { label: "本機真相來源",
              note: "分身讀本機真相來源 · 拔掉網路線也還在" },
  snapshot: { label: "本機快照",
              note: "分身讀本機快照 · 是落盤那一刻的樣子，不是即時的" },
  // 公網那一層的話**分兩種**，因為它們不是同一件事：
  //   (a) 本機試過了、讀不到 ⇒ 它真的是「退路」；
  //   (b) 這一頁**根本沒接本機來源** ⇒ 說「本機讀不到」就是編出來的。
  // 兩種都帶 ⚠（公網在展場都是脆弱的那一條），但話不一樣。
  cloud:    { label: "公網",
              note:     "⚠ 分身改讀公網 · 本機那一份讀不到，這是退路不是常態",
              noteOnly: "⚠ 分身只讀公網 · 這一頁沒接本機來源，斷網就沒有新的人" },
};

/** 這個來源算不算「斷了」。判準與 `liveStale()` 同一條：看**距離上一次成功
 *  多久**，不看「上一次有沒有錯」——一次偶發失敗不該讓畫面喊斷線，
 *  而**從頭到尾沒成功過**（`lastOkAt` 是 null）要算斷。 */
function twinStale(st, nowMs){
  if (!st || !st.configured) return false;   // 根本沒接來源 ⇒ 不是「斷線」
  if (!st.lastOkAt) return true;             // ⚠ null＝一次都沒成功過
  const gap = Math.max(10000, (st.intervalMs || 5000) * 3);
  return (nowMs - st.lastOkAt) > gap;
}

/** 畫面上那一句：現在讀的是哪一個來源，斷了就講斷了。
 *
 *  回 `null` ＝**這一頁沒有接分身來源**（凍結重放模式）。那時候畫面什麼都
 *  不要講——沒接上跟接上了讀不到是兩件事，不可以在畫面上同形。 */
function twinSourceLine(st, nowMs){
  if (!st || !st.configured) return null;
  if (twinStale(st, nowMs)){
    if (!st.lastOkAt)
      return "⚠ 分身來源：一個都讀不到 · 不會有新的人進來";
    const sec = Math.max(1, Math.round((nowMs - st.lastOkAt) / 1000));
    const was = TWIN_SOURCE[st.kind] ? TWIN_SOURCE[st.kind].label : "上一個來源";
    return `⚠ 分身來源：${was}斷了 ${sec} 秒 · 不會有新的人進來`;
  }
  const s = TWIN_SOURCE[st.kind];
  if (!s) return "⚠ 分身來源：說不出是哪一個";
  if (st.kind === "cloud"){
    // 這一輪有沒有真的試過本機？試過才叫「退路」。
    const localTried = (st.tried || []).some(x => x && x.kind !== "cloud");
    return localTried ? s.note : s.noteOnly;
  }
  // 讀得到 ≠ 內容是活的。快照那一層要多問一句（見 twinSnapshotWarning）。
  return twinSnapshotWarning(st, nowMs) || s.note;
}

/** 快照多久沒被寫就算「沒人在寫了」。
 *  跟 `ops/exhibit/twin/venue_check.sh` 第八之二節的 `--twin-max-age-min`
 *  預設值同一個數字（loop 預設 15 秒一輪 ⇒ 10 分鐘＝連錯 40 輪）。 */
const TWIN_SNAPSHOT_MAX_AGE_MS = 10 * 60 * 1000;

/** 🔴 **靜默降級：讀得到，但沒有人在寫。**
 *
 *  2026-09-21 批判者查到的兩個坑，這一支同時處理：
 *
 *  1. 沒帶 `&twin=` 的時候，活模式會組出**只有一層** snapshot 的來源鏈，
 *     而那個檔（`world3/live/visitors.json`）是 commit 進版控的空佔位檔
 *     ——`people: []`、`generated_at: null`，**沒有任何東西會去寫它**
 *     （要 `vacant-twin-loop.service` 起來才有）。
 *  2. loop 起來過又死掉：檔案還在、還是 200、`lastOkAt` 永遠新鮮，
 *     內容卻停在三小時前。
 *
 *  兩種情況舊版畫面都平靜地說「分身讀本機快照 · 是落盤那一刻的樣子」，
 *  **一個 ⚠ 都沒有**。觀眾掃 QR、投了卡、站在那裡等一個不會出現的分身。
 *
 *  ⚠ **只對 snapshot 那一層問。** `store`（`twinlink serve`）的
 *    `generated_at` 是**請求當下現算的**，永遠新鮮 ⇒ 拿它判新鮮度毫無鑑別力，
 *    問了只會給出一個假的綠燈。「端點活著」與「loop 活著」是兩件事。
 *
 *  ⚠ **`payloadAt` 是 `null` ＝沒帶時間戳，不是「0 分鐘前」。**
 *
 *  回 `null` ＝沒話要說（不是 snapshot、或快照是新鮮的）。吃參數不讀全域。 */
function twinSnapshotWarning(st, nowMs){
  if (!st || st.kind !== "snapshot") return null;
  if (st.payloadAt == null)
    return "⚠ 分身快照沒有時間戳 · 沒有東西在寫它，不會有新的人進來";
  const age = nowMs - st.payloadAt;
  if (age <= TWIN_SNAPSHOT_MAX_AGE_MS) return null;
  const min = Math.max(1, Math.round(age / 60000));
  return `⚠ 分身快照停在 ${min} 分鐘前 · 沒有東西在寫它，不會有新的人進來`;
}

/** 分身的話是誰生的（`twinlink.py` 誠實邊界 2：`engine` 欄位不是裝飾）。
 *
 *  `lmstudio:*` ＝真的有一顆模型回了話；`fallback_deterministic` ＝查表湊的。
 *  **把後者講成前者就是鐵律 5 的展場版本。** 沒帶 `engine` 就說沒帶，不猜。 */
function twinEngineNote(sub){
  const e = sub && sub.twin ? sub.twin.engine : null;
  if (e == null) return null;                       // 沒接分身來源的訪客 ⇒ 不掛這一句
  if (e === "fallback_deterministic")
    return "⚠ 他說的話是查表湊的，這一次沒有模型參與";
  if (String(e).indexOf("lmstudio:") === 0)
    return "他說的話是本機那台機器上的模型生的";
  return "他說的話從哪來，資料裡標的是「" + String(e).slice(0, 24) + "」";
}

/** 證據等級：監視器裡那一行（短），右邊靠齊所以不能太長。 */
const EV_SHORT = {
  "L-real": "AI 真的動手了",
  "L-fake": "假上游 · 不是 AI 的能力",
  "L-none": "AI 沒有動手 · 交件是腳本寫的",
  "L-unknown": "上游沒留紀錄",
};
function evidenceRow(t){
  const e = t && t.evidence;
  if (!e) return { text: "沒有跟著資料過來", tone: null };
  return { text: EV_SHORT[e] || String(e), tone: e === "L-real" ? "good" : null };
}

/** 證據等級的完整說明——**那一句不准被蓋掉**。
 *
 *  所以它不放左上角（那裡跟置中的大標搶位子，而大標多長取決於場景），
 *  改放監視器底下那一欄：那一欄本來就是空的，寬度固定，而且跟
 *  「這一筆」的其他欄位放在一起本來就比較合理。 */
function evidenceNote(t){
  if (!t) return "";
  if (t.evidence_note) return t.evidence_note;
  if (!t.evidence)
    return "這一格沒有帶證據等級，所以這台電視說不出它是不是真模型跑的。";
  return liveBanner(t).sub;
}

/** 場景的大標是**烤死在場景表裡**的。三句在 `vacant run` 這條路上不成立：
 *
 *    s06「誰來做 不是用猜的／讓路徑決定誰向前」 → 這條路上沒有路由層，
 *        誰做這一格是人指定的。「讓路徑決定」正是 A3 那個錯的最大號字體版。
 *    s07「三個同儕評審／判不通過 要拿得出反例」 → 沒有評審層。這一拍演的是閘門。
 *    s08「被推翻就改／改完 再驗一次」 → 沒有人推翻它；是閘門擋下、它自己再跑一次。
 *
 *  ⚠ **大標是整個畫面上最大的字。** 字幕改對了、大標還在說謊，等於沒改——
 *  1920×1080 實測就長這樣：字幕寫「這條路上沒有同儕評審」，
 *  它正上方 100px 的大標寫「三個同儕評審」。
 *
 *  回 null ＝ 用場景表原本那一句（凍結重放那一批真的有那些層，原句是對的）。 */
function beatTitle(sceneId, row){
  if (!row) return null;
  if (sceneId === "s06" && row.route_basis === "random")
    return { head: "誰來做 是人指定的", sub: "這條路上沒有路由層——不是信譽決定的" };
  if (sceneId === "s07" && !row.has_review_layer)
    return { head: "跑客戶的驗收測資", sub: "過了才交付 沒過就擋下" };
  if (sceneId === "s08" && !row.has_review_layer)
    return { head: "閘門擋下 它自己再改", sub: "同一個 agent 帶著自己的失敗原文再跑一次" };
  // s12 的烤死副標是「沒過驗收測資，就退回去重做」——**這一格沒有重做**
  //（`attempts_used` 是 1），講「重做」是講了一件沒發生的事。
  if (sceneId === "s12" && (row.gates || []).length <= 1)
    return { head: "這一份沒有交出去", sub: "沒過客戶的驗收測資，就不交出去" };
  return null;
}

/** 手機剛剛按出來、而且已經收得了尾的那一格（`null` ＝ 沒有）。
 *
 *  ⚠ 只認**人按的**（`why` 是 `phone*`），不認自動輪播。
 *  理由：輪播每 20–30 秒就吐一格，如果那也插播，觀眾引導那一段
 *  （掃 QR ／打開你常用的 AI ／貼回來送出）就永遠輪不到。
 *  **人按了要立刻有反應；機器自己播的排在後面。** */
function livePreempt(L){
  const now = L && L.stage && L.stage.now;
  if (!now || !now.cell_id) return null;
  if (!/^phone/.test(String(now.why || ""))) return null;
  return L.pending.some(e => e.task_id === now.cell_id && e.type === "verdict")
    ? now.cell_id : null;
}

/** QR 要抓哪一張（純函數，所以測得到）。
 *  回 null ＝ 沒有接展場機（離線凍結重放）⇒ 畫面上不要留一塊空白假裝有 QR。 */
function qrSource(stage, liveUrl){
  if (stage && stage.qr_url) return stage.qr_url;
  if (liveUrl && liveUrl.indexOf("/live/events.jsonl") >= 0)
    return liveUrl.replace("/live/events.jsonl", "/qr.png");
  return null;
}

/** **觀眾按下去之後，畫面要把因果講出來。**
 *
 *  ⚠ Fable 的觀眾視角稽核：對照其實存在（扣住那格擋下、寫明那格收下），
 *  但**沒有任何一幀把「因為你寫了名字所以過了」講給觀眾**。
 *  監視器上那幾行 18px 小字不負責講因果。
 *
 *  回 null ＝ 這一格不是他按出來的（輪播的），那就不要假裝是。 */
function pressedBanner(t, stage){
  if (!t || !stage || !stage.now) return null;
  if (!/^phone/.test(String(stage.now.why || ""))) return null;
  if (stage.now.cell_id !== t.id) return null;
  const label = stage.now.side_label
    || (stage.now.side === "pc" ? "告訴它名字" : "不告訴它名字");
  const row = t.ON;
  const out = row.accepted === false ? "閘門擋下了，沒有交出去"
            : row.accepted === true ? "通過客戶的驗收，交出去了"
            : "這一格沒有跑驗收";
  return { head: `你按了「${label}」`, tail: out,
           tone: row.accepted === false ? "good" : "good" };
}

/** 收據上鏈那一拍的副標。
 *
 *  ⚠ **B3 的第三個現場**（前兩個是監視器那一行與 liveAssemble 的欄位）：
 *  這一拍的字幕是「這一筆的收據已經接上鏈」，底下卻印 `prompt_sha256`
 *  ——把**題面的 hash** 當成**收據的 hash**。1920×1080 實跑截到：
 *  同一畫面上監視器寫「題面雜湊 8257ace29752」「收據鏈頭 57f12d1f7d64」，
 *  而這一行寫「雜湊 8257ace297526128」。**同一個畫面自己打自己。**
 *
 *  凍結重放的資料裡**沒有鏈頭** ⇒ 照實說沒有，不准拿題面雜湊充數。 */
function chainBeatSub(t){
  const tail = "誰做的、驗了什麼、判了什麼，都在裡面——可以自己重跑";
  const head = ((t && t.chain_head) || "").slice(0, 16);
  if (head) return `收據鏈頭 ${head}　·　${tail}`;
  return `這一批的資料裡沒有帶鏈頭　·　${tail}`;
}

/** 導播列：手機按了什麼、有沒有人正在自己重驗收據。
 *
 *  ⚠ 誠實邊界：電視**不驗簽章**（事件流本身沒有簽章，LIVE_INTERFACE.md §四）。
 *  所以翻位元那一句只講「有人正在他自己的手機上重算」——那是關於現場發生什麼的
 *  陳述，不是關於密碼學結果的宣告。**面板不是信任來源。** */
function stageStrip(stage, playingId){
  if (!stage) return null;
  const out = [];
  const now = stage.now || {};
  // ⚠ 只在**真的在演那一格**的時候講。舊版在引導畫面（還沒有人掃 QR）就印
  //   「手機選了：介面寫明」——第一個走過來的人會以為已經有人在玩了。
  if (now.side && playingId && now.cell_id === playingId)
    out.push("有人選了：" + (now.side_label
      || (now.side === "held" ? "不告訴它名字" : "告訴它名字")));
  // ⚠ 實測抓到的謊：舊版把 `tamper.cell_id` 直接印出來，而那個狀態
  //   **只能靠明確呼叫 `untamper` 清掉**（伺服器那一端已經加了 TTL ＋ 換格就清）。
  //   第一個觀眾按完走掉，那行字留在螢幕上 4 分半，對後面每一位觀眾
  //   **指著一格他們沒看到的東西**。光看畫面看不出來——字在、格式對、措辭也對。
  //   ⇒ 電視這一端也擋一道（面板不是信任來源，`/state` 也不是）：
  //     講的那一格不是正在演的那一格，就不准說「這一格」，也不准印 cell_id
  //     （觀眾看不到那個 id，印出來只會讓他找不到對應的東西）。
  if (stage.tamper && stage.tamper.cell_id){
    const playing = (stage.now || {}).cell_id;
    out.push(stage.tamper.cell_id === playing
      ? "有人正在自己的手機上重算這一格的收據（這台電視不驗簽章）"
      : "剛才有人在自己的手機上重算了另一格的收據（這台電視不驗簽章）");
  }
  if ((stage.skipped || []).length)
    out.push(`有 ${stage.skipped.length} 格沒有收尾，沒播`);
  return out.length ? out.join("　·　") : null;
}


/* ---- 凍結重放（replay_371）→ 同一個形狀 ------------------------------------
   活模式與凍結重放走**同一組判準函數**。理由不是省程式碼：兩邊用兩套判準的時候，
   修好的只會是被測到的那一邊。G 實驗那一批**真的有**評審層、抽樣稽核層與 OFF 臂，
   所以它照實說有；`vacant run` 這條路上沒有，所以它照實說沒有。
   **差別由資料決定，不由模式決定。** */
function normalizeReplayRow(r){
  if (!r) return null;
  const votes = Array.isArray(r.votes) ? r.votes : [];
  const hasReview = Array.isArray(r.votes) && r.votes.length > 0;
  const acc = tri(r.accepted), vis = tri(r.visible_ok);
  // 停止理由：凍結重放沒有這個欄位，但推得出來的只推推得出來的那些。
  let stop = null;
  if (acc === true) stop = "visible_pass";
  else if (acc === false && vis === false) stop = "visible_fail";
  else if (acc === false && hasReview && r.passed_review === false) stop = "review_reject";
  return {
    worker: r.worker || null,
    // replay_371 沒有記路由依據 ⇒ null。**沒記就是沒記，不准寫成「依信譽紀錄」。**
    route_basis: r.basis || null, route_note: "",
    votes, has_review_layer: hasReview,
    has_audit_layer: r.audited !== null && r.audited !== undefined,
    audited: !!r.audited, audit_ok: tri(r.audit_ok),
    attempts: 1, attempts_used: null, retry: null,
    revisions: (r.reviser && r.selected_version === "revised")
      ? [{ reviser: r.reviser, transition: r.revision_transition || "", attempt: 2 }] : [],
    reviser: r.reviser || null,
    selected_version: r.selected_version || "initial",
    gates: vis === null ? []
      : [{ passed: vis, n_tests: null, failed_case: null, attempt: 1, of: 1 }],
    visible_ok: vis, failed_case: null, n_tests: null,
    accepted: acc, meets_demand: tri(r.meets_demand),
    stop_reason: stop, blocked_by: null,
    timed_out: false, feedback_delivery: null,
    // 凍結重放沒記這一臂有沒有收據、也沒有事後稽核 ⇒ **不要編**。
    infra_void: false, has_receipt: null, postaudit: null, ran: true,
  };
}
function normalizeTask(t){
  if (!t) return null;
  if (t.__live) return t;
  // 原封帶過去（`sha`／`keyword_zh` 之類導演還要用的欄位不能掉），只換兩隻臂，
  // 並補上活模式才有、凍結重放沒有的那幾個欄位——**補成 null，不是補成一個值**。
  return Object.assign({}, t, {
    // 凍結重放的資料裡沒有收據鏈頭。沒有就是沒有，監視器那一行印「—」。
    chain_head: "", verify_url: "",
    // 證據等級：那一批是真模型（`source.model` 記著），但**逐格的 requests_seen
    // 沒有搬進 replay_371** ⇒ 這台電視推不出來，所以不宣告。
    evidence: null, evidence_note: "", stratum: null,
    ON: normalizeReplayRow(t.ON), OFF: normalizeReplayRow(t.OFF),
    __live: false,
  });
}

/** 待機那一句話裡的數字：**現在真的載進來的那一批**，不是寫死的 371。
 *
 *  ## 371 是什麼（查出來的，不是編的）
 *
 *  `data/replay_371.json`（→ `world2/data/replay_371.json`）的 `source` 欄寫著：
 *
 *      on_run  runs/g_onoff5_371_r123_20260825
 *      off_run runs/g_off371_20260825
 *      model   qwen/qwen3.6-35b-a3b
 *      note    每一格都是實驗當時落盤的原值，未經加工
 *
 *  對照 Vacant repo 的 `runs/INDEX.md`：兩個 run 都是 **2026-08-25 的 MBPP+
 *  v0.2.0、371 題**（同一份題庫 R529 也在用）。檔案裡 `tasks` 陣列剛好 371 筆。
 *  **所以 371 對得上，而且對得上的是那一批凍結重放。**
 *
 *  ## 為什麼這一行不能寫死
 *
 *  活模式（`?live=`）播的是**完全另一批**：`runs/twin_real_20260919`
 *  ——2026-09-19、`vacant run` 真跑、三位合成居民 × 9 題 × 兩種題面 ＝ 54 格
 *  （27 對）。它**不是那 371 件的子集**，題庫、模型、跑法、日期全都不同。
 *  兩批唯一的共同點是「都是跑完落盤的真紀錄，未經加工」。
 *
 *  舊版把 371 寫死在 `SCENES.s00.sub` 裡 ⇒ 活模式下畫面先說「走過 371 件
 *  真實任務的一群人」，接著演 54 格 ⇒ **觀眾會以為眼前這些格就是那 371 件**。
 *  那不是措辭問題，是一句**在活模式下為真的東西作不實見證**的話。
 *
 *  ⇒ 數字改成從**載進來的資料**算：凍結重放 ⇒ `REPLAY.tasks.length`（＝371，
 *    與舊文案逐字相同）；活模式 ⇒ `/state.pairs.length`（＝27）。
 *    兩邊都為真，而且永遠不會跟資料漂開。 */
function standbyCount(replay, stage){
  // 活模式優先：`REPLAY` 在活模式下**還是會載**（那一行 fetch 是無條件的），
  // 不先看 stage 就會又印回 371。
  if (stage && Array.isArray(stage.pairs) && stage.pairs.length) return stage.pairs.length;
  if (replay && Array.isArray(replay.tasks) && replay.tasks.length) return replay.tasks.length;
  return null;   // 什麼都還沒載進來 ⇒ 不給數字（沒量到不是量到 0）
}
function standbySub(replay, stage){
  const n = standbyCount(replay, stage);
  return n == null ? "走過真實任務的一群人" : `走過 ${n} 件真實任務的一群人`;
}

// s11「你可以一直看下去」的副標同樣帶一個數字。
// ⚠ 2026-09-20：它原本寫死「這 **18** 格會一直重播」——那是**第四次**同一個病
//   （371 那個數字、斷線安靜退回重放、`IDLE_HONESTY` 的 18，現在這個）：
//   **寫死一個當時為真的事實，資料換了之後沒人更新它。**
//   活模式實際播的是 `runs/twin_real_20260919` 的 **54 格**。
//   沿用 `standbyCount` 同一個來源，所以兩處永遠一致。
function loopSub(replay, stage){
  const n = standbyCount(replay, stage);
  return n == null ? "這些格會一直重播" : `這 ${n} 格會一直重播`;
}

/* === LIVE-END === */

async function livePoll(){
  if (!LIVE.url) return;
  try {
    const r = await fetch(LIVE.url, { cache: "no-store" });
    const evs = liveParse(await r.text());
    for (const e of evs){
      if (!liveRemember(LIVE, liveKey(e))) continue;
      if (e.type === "counters") LIVE.counters = e;
      else LIVE.pending.push(e);
    }
    LIVE.on = true; LIVE.lastErr = null; LIVE.lastOkAt = Date.now();
  } catch(err){ LIVE.lastErr = String(err).slice(0, 60); }
}

// **活的那條斷掉時，畫面必須說出來。**
//
// 2026-09-20 查到的洞：`livePoll` 的 catch **只寫 `lastErr`，不動 `LIVE.on`**
// ⇒ 斷線之後 `LIVE.on` 維持 true、`liveAssemble` 拿不到事件、導播掉進
// `if (this.cooldown <= 0 && REPLAY)` ⇒ **安靜地改播 371 凍結重放**。
// 底下那行誠實句雖然會跟著變成「真紀錄重放」（所以不算說謊），但
// **沒有任何地方講「現場斷了」** ⇒ 無人值守的展場沒有人會發現。
// 人類 2026-09-20：「我們不會有任何 demo 的狀態，只會連接真實的。」
// ⇒ 退回重放本身可以（展場不能黑畫面），**但不准安靜地退**。
//
// ⚠ 判準用「距離上一次成功多久」不是「上一次有沒有錯」：一次偶發的 fetch 失敗
//   不該讓畫面喊斷線，而**從頭到尾沒成功過**（`lastOkAt` 是 0）要算斷。
//   門檻＝輪詢間隔 ×3，地板 10 秒。
function liveStale(){
  if (!LIVE.url) return false;                 // 根本沒設活模式 ⇒ 不是「斷線」
  const gap = Math.max(10000, (LIVE.poll || 2000) * 3);
  return !LIVE.lastOkAt || (Date.now() - LIVE.lastOkAt) > gap;
}
// 導播狀態：手機按了什麼。`state` 參數可省略——從 live 網址推得出來。
function liveStateUrl(){
  if (LIVE.stateUrl) return LIVE.stateUrl;
  if (!LIVE.url) return null;
  return LIVE.url.indexOf("/live/events.jsonl") >= 0
    ? LIVE.url.replace("/live/events.jsonl", "/state") : null;
}
async function liveStatePoll(){
  const u = liveStateUrl();
  if (!u) return;
  try { LIVE.stage = await (await fetch(u, { cache: "no-store" })).json();
        LIVE.stageErr = null; }
  catch(err){ LIVE.stageErr = String(err).slice(0, 60); }
}
if (LIVE.url){
  livePoll(); setInterval(livePoll, Math.max(500, LIVE.poll));
  liveStatePoll(); setInterval(liveStatePoll, Math.max(1000, LIVE.poll));
}

/* ── 主迴圈 ──────────────────────────────────────────────────── */
let last = 0, lastFrameTs = performance.now(), frameCount = 0;
function frame(ts){
  lastFrameTs = performance.now(); frameCount++;
  const dt = Math.min((ts - last)/1000, 0.1) * FAST; last = ts;
  // 鏡頭 v2：入場落點略緊、1.4s ease-out 鬆開（cut 的「坐定」感），
  // 之後整場緩推 1.00→1.032（鏡頭一直在呼吸）
  let push;
  if (sceneT < 1.4){
    const e = 1 - Math.pow(1 - sceneT/1.4, 3);      // easeOutCubic
    push = 1.045 - 0.045 * e;
  } else {
    push = 1 + Math.min((sceneT - 1.4) / 11, 1) * 0.032;
  }
  cx.save();
  const jb = Math.floor(ts * 0.012);
  const fract = x => ((x % 1) + 1) % 1;
  const jx = (fract(Math.sin(jb * 127.1) * 43758.5453) - 0.5) * 1.4;
  const jy = (fract(Math.sin(jb * 311.7) * 12543.8571) - 0.5) * 1.4;
  cx.translate(W/2 + jx, H/2 + jy); cx.scale(push, push); cx.translate(-W/2, -H/2);
  // 標示層的鏡頭：輪到誰就往誰那邊推近一點。**只放大不平移**（k>=1），
  // 以畫面內任一點為心的放大數學上不可能露出板的邊緣。`?markcam=0` 關掉。
  const mcam = marklayer.camera();
  if (mcam){ cx.translate(mcam.x*W, mcam.y*H); cx.scale(mcam.k, mcam.k);
             cx.translate(-mcam.x*W, -mcam.y*H); }
  drawPlate(sceneId);
  preloadNextScene();
  director.update(dt);
  arrivals.update(dt);
  marklayer.update(dt);
  for (const c of cast) c.update(dt);
  if (window.__spawnHold){                              // ?scene=s04 驗證凍結（含影片本身）
    window.__spawnHold.spawning = 0.55;
    const se = videoPool.get(VIDEO_SRC.spawn(window.__spawnHold.vid));
    if (se) se.v.loop = true;
  }
  // 互斥推開（只推同台的）
  const on = cast.filter(c => c.onstage);
  for (let i = 0; i < on.length; i++){
    for (let j = i+1; j < on.length; j++){
      const a = on[i], b = on[j];
      const dx = b.nx - a.nx, dy = (b.ny - a.ny) * 2.4;
      const d = Math.hypot(dx, dy), min = 0.07;
      if (d > 0 && d < min){
        const push2 = (min - d) * 0.5 * dt * 3;
        const ux = dx/d, uy = dy/d/2.4;
        if (!a.reserved){ a.nx -= ux*push2; a.ny -= uy*push2; }
        if (!b.reserved){ b.nx += ux*push2; b.ny += uy*push2; }
      }
    }
  }
  on.sort((a,b) => a.ny - b.ny);
  // v4：整格渲染影片在播時，群眾已在畫面裡——只畫訪客分身（s04/s05）與 spawn 中的人
  const baked = !!sceneVideoReady(sceneId) && sceneId !== "s04" && sceneId !== "s05";
  for (const c of on){
    if (baked && c !== director.visitor && !(c.spawning > 0)) continue;
    c.draw();
  }
  marklayer.drawSpot();       // 標示層：壓暗＋腳下光圈（在投遞口之前，別把它弄糊）
  sceneDraw(sceneT, director);
  arrivals.draw();            // 抵達層在鏡頭變換裡面（信要落在板上的郵筒口）
  marklayer.draw();           // 標示層的陶牌：整個動線的答案，不准被蓋住
  cx.restore();
  // 交叉溶接：上一景的最後一幀淡出蓋在新景上（0.7s）
  if (snapA > 0 && snapCv){
    snapA = Math.max(0, snapA - dt / 0.7);
    cx.globalAlpha = snapA * snapA;                 // 二次方衰減：尾段乾淨
    cx.drawImage(snapCv, 0, 0);
    cx.globalAlpha = 1;
  }
  drawOverlays(sceneT);
  const sc = scene();
  const tov = director.titleOv;
  // s00（待機）的副標帶一個數字，而那個數字要跟**現在載進來的那一批**一致
  // （`standbySub`：371 是凍結重放那一批，活模式是另外 27 對）。
  const subNow = tov ? tov.sub
                     : sceneId === "s00" ? standbySub(REPLAY, LIVE.stage)
                     : sceneId === "s11" ? loopSub(REPLAY, LIVE.stage)
                     : sc.sub;
  drawTitle(tov ? tov.head : sc.head, subNow, sceneT);
  // 徽章＝**資料從哪來**（sourceBadge），不是證據等級。
  // ⚠ 1920×1080 實測：徽章也印證據等級 ⇒ 左上角同時出現兩個「機制模擬」。
  //   證據等級在監視器裡（一行）＋左上大框（一個詞）就夠了。
  drawBadge(director.mode.startsWith("replay")
    ? sourceBadge(LIVE.on && director.caseKind === "live")
    : sc.badge);
  if (director.mode.startsWith("replay") || director.mode === "visitor_receipt"){
    drawMonitor(director);
    // ⚠ 底部已經有 drawCaption（大字）＋ drawHonesty（誠實列）兩條。
    //   再加案例橫幅＝同一塊畫面三條字在搶（人類 2026-09-21 實拍）。
    if (!director.visitor && !SIMPLE) drawCaseBanner(director);
  }
  drawCaption(director.caption, director.capSub);
  drawPressed(director);
  drawQrCorner();                     // 常駐：中途走過來的人也掃得到
  drawHonesty(director);
  requestAnimationFrame(frame);
  const heapMB = performance.memory ? (performance.memory.usedJSHeapSize/1048576)|0 : -1;
  document.title = `sc=${sceneId} mode=${director.mode} pool=${videoPool.size} `
    + `heap=${heapMB}MB reloads=${sessionStorage.getItem("vw_reloads")||0}`;
}
resize();
requestAnimationFrame(frame);

/* ── 自我驗證：?scene=sNN 直跳（截圖與劇照併排的可執行版）────── */
addEventListener("load", () => {
  const sn = Q.get("scene");
  if (sn && SCENES[sn]){
    READY.then(() => {
      director.mode = "hold";            // 凍結導演，純看場景
      setScene(sn); xfade = 0; sceneT = Q.has("late") ? 8 : 1.2;
      const s = SCENES[sn];
      if (sn === "s11"){
        cast.forEach((c, i) => { c.onstage = true;
          if (s.slots[i]) c.place(s.slots[i][0], s.slots[i][1]); });
      } else if (sn === "s07"){
        const ids = ["careful-1","plain-1","hasty-1"];
        director.stage(ids.map((n, i) => [byAgent[n], s.slots[i],
          { act: i === 0 ? "lens" : (i === 1 ? "card_fail" : "card_pass"),
            dir: s.slots[i][0] < 0.5 ? 1 : -1 }]));
      } else if (sn === "s08"){
        director.stage([[byAgent["careful-1"], s.slots[0], {act:"write", dir:1}],
                        [byAgent["plain-1"], s.slots[1], {act:"card_fail", dir:-1}]]);
        sceneT = 6;
      } else if (sn === "s10"){
        director.verdict = { big:"收下了——其實不符需求（漏出）", tone:"bad" };
        const cs = cast.filter(c => !c.agent);
        director.stage([...cs.slice(0,6).map((c,i)=>[c, s.slots[i], {dim:0.25}])]);
      } else if (sn === "s05"){
        director.bubbleText = "回文檢查";
        const cs = cast.filter(c => !c.agent);
        director.stage([[cs[0], s.slots[0], {dir:1, k:1.25}],
          ...cs.slice(1,8).map((c,i)=>[c, s.slots[i+1], {dim:0.85}])]);
      } else if (sn === "s04"){
        const cs = cast.filter(c => !c.agent);
        director.stage([[cs[0], s.slots[0]],
          ...cs.slice(1,8).map((c,i)=>[c, s.slots[i+1]])]);
        window.__spawnHold = cs[0];        // 驗證用：凍在成形中段
      } else if (sn === "s09"){
        const watchers = [...cast].filter(c => !c.agent).slice(0, 8);
        director.stage(watchers.map((c, i) => [c, s.slots[i], {dim: 0.3}]));
        director.auditText = "抽中 Mbpp/141 · sha256 3f8a92c1";
        sceneT = 4;
      } else if (sn === "s06"){
        const cold = director.crowd(3);
        const queue = cast.filter(c => !c.agent && !cold.includes(c)).slice(0, 3);
        director.stage([
          ...cold.map((c, i) => [c, s.slots[i], {dim: 0.35, dir: 1}]),
          [byAgent["careful-2"], [0.62, 0.85], {dir: 1}],
          ...queue.map((c, i) => [c, s.slots[4+i], {dim: 0.2}]),
        ]);
      } else {
        director.inviteStage(sn);
      }
    });
    return;
  }
  // ?demo=spawn：完整訪客流程壓縮跑（E2E 驗證用）
  if (Q.get("demo") === "spawn"){
    READY.then(() => {
      // 走跟真投稿**一樣的兩段**（抵達＋成形），否則 demo 驗不到抵達層。
      // `&sub=<id>` 讓演練／截圖用**真的** submission id，
      // 這樣手機上那個記號跟這裡算出來的會是同一個（不是靠人抄）。
      const sub = { id:(Q.get("sub") || "demo"), ts:0, card:{ need:"把一串數字加起來",
        shape:"圓潤", color:"暖土", texture:"光滑", first_line:"我來對帳的" }};
      arrivals.arrive(sub); spawnQueue.push(sub);
    });
  }
});
/* ── 展場接線＋kiosk ─────────────────────────────────────────────
   分身來源鏈：**本機優先，公網是退路**（CLAUDE.md 展場硬約束 2）。

     ?twin=<url>      twinlink serve 的唯讀端點（本機真相來源）。`off`＝關掉本機。
     ?twinfile=<url>  twinlink export 落盤的快照。活模式下預設＝同源 live/visitors.json
     ?api=<url>       公網收單服務。**永遠排在最後一層。**
     ?twinpoll=<ms>   輪詢間隔（預設 5000）

   展場的起法（exhibit_boot 印出來的電視網址後面接一段）：
     …/world3/index.html?live=http://<機器>:8899/live/events.jsonl&poll=2000
       &twin=http://127.0.0.1:8901/visitors.json

   ⚠ **store 那一層不給預設值。** 猜一個 `127.0.0.1:8901` 出來，猜錯就是
     每一輪一次「連線被拒」，而且 `sourceState()` 會長得像「試過本機了」。
     這個 repo 對「沒指定就 fail-closed、不要安靜地去打一個猜的位址」有前例
     （Vacant repo 的 `envmap.SINK_UPSTREAM`）。
   ⚠ **快照那一層只在活模式（`?live=`）下才預設開。** 不給參數的那一頁是
     離線凍結重放，回歸工具也是那樣載它的；在那裡憑空多一條輪詢 ⇒ 檔案不在
     就每輪一個 404 進 console，而 `tools/regress_check.py` 把 console error
     判成 FAIL。**沒有要讀分身的頁面就不要去讀。** */
addEventListener("load", () => {
  if (!window.WorldBridge) return;
  const twin = Q.get("twin");
  const locals = [];
  if (twin && twin !== "off") locals.push({ kind: "store", url: twin });
  const tf = Q.get("twinfile") ||
             ((LIVE.url && twin !== "off") ? "live/visitors.json" : null);
  if (tf) locals.push({ kind: "snapshot", url: tf });
  const api = Q.get("api");
  if (!locals.length && !api) return;          // 這一頁不讀分身（離線凍結重放）
  // ⚠ **活模式但沒有 `&twin=`**：來源鏈只剩下那個靜態快照，而快照要有
  //   `vacant-twin-loop.service` 在寫才有意義。展場的網址是
  //   `exhibit_boot.sh`／kiosk unit 產生的，兩邊都會帶 `&twin=`；
  //   手打網址漏掉的時候這一行是唯一的線索（畫面那一側由
  //   `twinSnapshotWarning` 負責，它看的是快照自己的時間戳）。
  if (LIVE.url && !twin && !api){
    try {
      console.warn("[分身] 這個網址沒有 &twin=：只剩快照那一層（" + tf + "）。"
        + "沒有 twinlink loop 在寫它的話，畫面右下角會說「沒有東西在寫它」。"
        + "展場的網址長這樣：…&twin=http://127.0.0.1:8901/visitors.json");
    } catch(e){}
  }
  WorldBridge.configure({
    local: locals,
    baseUrl: api || "",
    token: Q.get("token") || "dev-token",
    // ⚠ 預設 5000 → 1000（2026-09-21）。**這一行是「一秒內」的天花板。**
    //   抵達層自己是同步的（`onSubmission` 那一刻就開始飛信），所以端到端
    //   還剩下的延遲**只有這個輪詢間隔**：5 秒的話，觀眾按下送出最壞要站著
    //   等 5 秒才看到反應——那正是人類點名的那一秒。1000 是 `bridge.js`
    //   `configure()` 允許的下限（再低會被 `Math.max` 夾回來）。
    //   代價：本機那份 JSON 每秒讀一次（localhost、幾十 KB），量過不痛。
    //   要退回舊行為：`?twinpoll=5000`。
    intervalMs: Math.max(1000, +(Q.get("twinpoll") || 1000)),
  });
  // ⚠ **抵達與成形拆成兩件事**（2026-09-21）。以前這裡只有 `spawnQueue.push`，
  //   而那條線最短要等導演有空、最長要等一整格故事演完 ⇒ 觀眾按下送出的
  //   那一秒畫面是空的。`arrivals.arrive()` 是**同步**的：同一個 tick 就開始
  //   飛信，不等輪詢、不等影片、不等模型。成形那條線一個字都沒改。
  WorldBridge.onSubmission(sub => { arrivals.arrive(sub); spawnQueue.push(sub); });
  WorldBridge.start();
  console.log("WorldBridge 已啟動 · 來源鏈",
    locals.map(s => s.kind + "=" + s.url).concat(api ? ["cloud=" + api] : []).join(" → "));
});
addEventListener("keydown", e => {
  if (e.key === "d") document.body.classList.toggle("debug");
  if (e.key === "f"){
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(()=>{});
  }
});
setInterval(() => {
  // 背景分頁 rAF 會被 Chrome 節流——那不是凍結，看門狗不得開槍
  // （實測：背景掛一夜誤重載 8 次）
  if (document.hidden){ lastFrameTs = performance.now(); return; }
  if (performance.now() - lastFrameTs > 10000){
    sessionStorage.setItem("vw_reloads",
      (parseInt(sessionStorage.getItem("vw_reloads")||"0") + 1));
    location.reload();
  }
}, 5000);
