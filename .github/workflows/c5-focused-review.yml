name: C5 focused trace regression

on:
  push:
    branches:
      - review/c5-native-acceptance-20260928

permissions:
  contents: read

jobs:
  zero-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run zero-evidence test-claim regressions
        run: python -m pytest -q tests/test_zero_evidence.py -k 'test_test_claim'
