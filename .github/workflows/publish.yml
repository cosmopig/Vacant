# 發布到 PyPI。**這支不會自己跑**——只有兩個觸發點，兩個都要人動手：
# `release: published`（在 GitHub 上發一個 Release）或 `workflow_dispatch`（手動按）。
#
# 為什麼要重新加回來：這支在 2026-06 的大重寫（`677a645`）裡連同一票舊 workflow
# 一起被刪掉了，之後 repo 就沒有發布路徑。PyPI 上最新是 **0.6.0**，而 repo 已經是
# 0.7.0 ⇒ 外面的人 `pip install vacant-network` 拿到的是一個少了 `vacant run`
# 整條線的版本。
#
# ⚠ **用 Trusted Publishing（OIDC），不存任何 token。** 這件事要在 PyPI 那邊
#   設定一次，repo 這邊改不了：
#     https://pypi.org/manage/project/vacant-network/settings/publishing/
#     Owner: cosmopig ／ Repository: Vacant ／ Workflow: publish.yml ／ Environment: pypi
#   沒設定的話 `publish-pypi` 那個 job 會在拿 OIDC token 那一步失敗，
#   **不會退回去找密碼**——這是刻意的，失敗比悄悄用別的憑證好。
#
# ⚠ `build` 這個 job 與 `ci.yml` 的「build wheel + sdist + smoke install」**刻意重跑一次**。
#   理由：CI 驗的是 PR 當下那棵樹，這裡驗的是**真的要發出去的那份 artifact**，
#   而且 `publish-pypi` 吃的就是這個 job 上傳的那一份。中間不重建 ⇒ 發出去的
#   與驗過的是同一堆位元組。
name: publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    # 手動觸發：Release 被建立時沒觸發到（例如 tag 是手推的）可以補發。

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 讀出版本號
        id: version
        run: |
          python -m pip install --upgrade pip
          version=$(python -c "import pathlib,re; s=pathlib.Path('vacant/__init__.py').read_text(); print(re.search(r'__version__\s*=\s*[\"\x27]([^\"\x27]+)', s).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "要發的是 vacant-network==$version"

      - name: 建 sdist ＋ wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      # ⚠ **從 wheel 裝進一個乾淨的 venv 再跑一次**，不是在 repo 根目錄 import。
      #   在 repo 根目錄 `import vacant` 會撿到本地目錄而不是裝好的套件，
      #   於是「發出去的那份能不能用」根本沒被驗到（2026-09-18 踩過一次）。
      - name: 從 wheel 裝起來冒煙
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          cd /tmp                      # 離開 repo 根目錄，避免 import 被本地目錄遮住
          /tmp/smoke/bin/vacant --help > /dev/null
          /tmp/smoke/bin/python -c "import vacant, pathlib; \
            print('imported', vacant.__version__, 'from', pathlib.Path(vacant.__file__).parent); \
            assert 'site-packages' in vacant.__file__, '裝起來的不是 wheel 裡那份'"
          /tmp/smoke/bin/python -c "from vacant.vrun import launcher; print('vacant run 進得去', launcher.__name__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vacant-network
    permissions:
      id-token: write            # Trusted Publishing 要的，除此之外不要給
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: 用 Trusted Publishing 發出去
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # ⚠ `skip-existing` ＝同一個版本重發不會紅。它**不是**「覆寫」——
          #   PyPI 不允許覆寫已發的版本，改了東西就要升版本號。
          skip-existing: true
          verbose: true

  github-release-attach:
    name: attach wheel + sdist to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: 掛到 Release 上
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/* \
            --clobber --repo "${{ github.repository }}"
