<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/local.css">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c"></canvas>
<script>
// ───────────────────────── setup ─────────────────────────
const Q = new URLSearchParams(location.search);
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080);
const PORTRAIT = H > W;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const S = Math.min(W, H) / 1080;              // 1 in both 1920x1080 and 1080x1920
const CX = W / 2, CY = PORTRAIT ? H * 0.40 : H * 0.445; // content centre (above subtitles)
const COL = {
  bg: '#0a0907', ink: '#f5efe6', dim: 'rgba(245,239,230,0.55)', faint: 'rgba(245,239,230,0.18)',
  or: '#f26b1d', orD: '#7a2f06', red: '#ff4a3d', green: '#5ee6a0', mono: 'rgba(245,239,230,0.62)'
};
const ZH = '"Noto Sans TC"', LAT = '"Inter","Noto Sans TC"', MONO = '"JetBrains Mono","Noto Sans TC"';
let CUES = [];
const LOGO = [
"█   █  ███   ███   ███  █   █ █████",
"█   █ █   █ █   █ █   █ ██  █   █  ",
"█   █ █   █ █     █   █ ██  █   █  ",
"█   █ █████ █     █████ █ █ █   █  ",
"█   █ █   █ █     █   █ █  ██   █  ",
" █ █  █   █ █   █ █   █ █  ██   █  ",
"  █   █   █  ███  █   █ █   █   █  "];
const LOGO_PTS = [];
LOGO.forEach((row, r) => [...row].forEach((ch, c) => { if (ch === '█') LOGO_PTS.push([c, r]); }));

// ───────────────────────── math ─────────────────────────
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eOutCubic = x => 1 - Math.pow(1 - x, 3);
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eInCubic = x => x * x * x;
const eOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
// fade window: in over [a,a+fi], out over [b-fo,b]
const win = (t, a, b, fi = .35, fo = .35) => Math.min(P(t, a, a + fi), 1 - P(t, b - fo, b));
function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 1e9) / 1e9; }; }
function hex(seed, n) { const r = rng(seed * 7919 + 13); let s = ''; for (let i = 0; i < n; i++) s += '0123456789abcdef'[Math.floor(r() * 16)]; return s; }

// ───────────────────────── text + overflow audit ─────────────────────────
let AUDIT = [];
function font(size, weight = 500, fam = ZH) { return `${weight} ${Math.round(size * S)}px ${fam}`; }
/** draws text; shrinks to maxW; records bounds for the per-frame overflow audit */
function txt(s, x, y, o = {}) {
  const size = o.size || 40, fam = o.fam || ZH, weight = o.weight || 500;
  ctx.save();
  ctx.globalAlpha *= (o.alpha === undefined ? 1 : o.alpha);
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  ctx.letterSpacing = (o.ls || 0) * S + 'px';
  let px = size;
  ctx.font = font(px, weight, fam);
  if (o.maxW) { const w = ctx.measureText(s).width; if (w > o.maxW) { px = size * o.maxW / w; ctx.font = font(px, weight, fam); } }
  const w = ctx.measureText(s).width, h = px * S;
  if (o.glow) { ctx.shadowColor = o.glowColor || o.color || COL.or; ctx.shadowBlur = o.glow * S; }
  ctx.fillStyle = o.color || COL.ink;
  if (o.scale && o.scale !== 1) { ctx.translate(x, y); ctx.scale(o.scale, o.scale); ctx.fillText(s, 0, 0); }
  else ctx.fillText(s, x, y);
  ctx.restore();
  const sc = o.scale || 1;
  const al0 = o.align || 'center';
  const left = al0 === 'left' ? x : (al0 === 'right' ? x - w * sc : x - w * sc / 2);
  if ((o.alpha === undefined ? 1 : o.alpha) > 0.04 && !o.noAudit)
    AUDIT.push({ s, x0: left, x1: left + w * sc, y0: y - h * sc / 2, y1: y + h * sc / 2, tag: o.tag || '' });
  return w;
}
function measure(s, size, weight = 500, fam = ZH, ls = 0) { ctx.save(); ctx.letterSpacing = ls * S + 'px'; ctx.font = font(size, weight, fam); const w = ctx.measureText(s).width; ctx.restore(); return w; }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// ───────────────────────── background layers ─────────────────────────
const GRAIN = [];
function makeGrain() {
  for (let k = 0; k < 6; k++) {
    const g = document.createElement('canvas'); g.width = g.height = 256;
    const gx = g.getContext('2d'), im = gx.createImageData(256, 256), r = rng(k + 1);
    for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    gx.putImageData(im, 0, 0); GRAIN.push(g);
  }
}
const DUST = (() => { const r = rng(42), a = []; for (let i = 0; i < 140; i++) a.push({ x: r(), y: r(), z: .3 + r() * .7, p: r() * 6.28 }); return a; })();
let FREEZE = 0; // 0..1, slows the world at the "done" moment
let worldT = 0;
function background(t, f) {
  ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);
  // warm radial glow that breathes
  const gl = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * .7);
  const b = .10 + .03 * Math.sin(t * .7);
  gl.addColorStop(0, `rgba(242,107,29,${b * (1 - FREEZE * .7)})`); gl.addColorStop(.45, 'rgba(242,107,29,0.02)'); gl.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
  // pixel dot grid (8-bit motif)
  const step = 36 * S, off = (worldT * 6 * S) % step;
  ctx.fillStyle = 'rgba(245,239,230,0.045)';
  for (let x = -step + off; x < W + step; x += step) for (let y = -step + off * .5; y < H + step; y += step) ctx.fillRect(x, y, 2 * S, 2 * S);
  // floating dust
  for (const d of DUST) {
    const x = ((d.x + worldT * .006 * d.z) % 1) * W, y = ((d.y - worldT * .01 * d.z + 10) % 1) * H;
    const a = .08 + .12 * d.z * (0.5 + .5 * Math.sin(worldT * 1.3 + d.p));
    ctx.fillStyle = `rgba(242,107,29,${a})`; ctx.fillRect(x, y, 2.2 * S * d.z, 2.2 * S * d.z);
  }
}
function post(t, f) {
  // vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.72)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  // grain
  ctx.save(); ctx.globalAlpha = .055; ctx.globalCompositeOperation = 'overlay';
  const g = GRAIN[f % GRAIN.length]; const pat = ctx.createPattern(g, 'repeat'); ctx.fillStyle = pat;
  ctx.translate((f * 37) % 256, (f * 91) % 256); ctx.fillRect(-256, -256, W + 512, H + 512); ctx.restore();
  // fade from / to black
  const fb = Math.max(1 - P(t, 0, .5), P(t, 59.25, 60));
  if (fb > 0) { ctx.fillStyle = `rgba(0,0,0,${fb})`; ctx.fillRect(0, 0, W, H); }
}

// ───────────────────────── deep layer (for people who pause) ─────────────────────────
function deep(t, lines, a, b, corner = 'tl') {
  const al = win(t, a, b, .5, .4) * .62; if (al <= 0) return;
  const m = 56 * S, lh = 24 * S;
  const x = corner.includes('l') ? m : W - m;
  const top = PORTRAIT ? H - 300 * S : 64 * S;
  lines.forEach((s, i) => {
    const shown = Math.floor(clamp((t - a - i * .12) * 60) * 1); // typewriter reveal
    const n = Math.min(s.length, Math.max(0, Math.floor((t - a - i * .12) * 70)));
    txt(s.slice(0, n), x, top + i * lh, { size: 17, fam: MONO, weight: 400, color: COL.mono, align: corner.includes('l') ? 'left' : 'right', alpha: al, maxW: (PORTRAIT ? W - 2 * m : W * .42), tag: 'deep' });
  });
}
function chapter(t, idx, label, a, b) {
  const al = win(t, a, b, .4, .4) * .5; if (al <= 0) return;
  const m = 56 * S, y = PORTRAIT ? H - 120 * S : H - 44 * S;
  txt(`${String(idx).padStart(2, '0')} / 07 — ${label}`, PORTRAIT ? W / 2 : W - m, y, { size: 15, fam: MONO, weight: 400, color: COL.dim, align: PORTRAIT ? 'center' : 'right', alpha: al, ls: 2, tag: 'chapter' });
}

// ───────────────────────── subtitles ─────────────────────────
function subtitles(t) {
  for (const c of CUES) {
    if (c.visual || c.i === 15) continue;        // drawn on-screen by the scene itself
    const a = c.start - .08, b = c.end + .35;
    const al = win(t, a, b, .12, .18); if (al <= 0) continue;
    const y0 = PORTRAIT ? H * .755 : H - 118 * S;
    const maxW = W - (PORTRAIT ? 110 : 360) * S;
    // soft backing
    ctx.save(); ctx.globalAlpha = al * .55;
    const g = ctx.createLinearGradient(0, y0 - 70 * S, 0, y0 + 90 * S);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.5, 'rgba(0,0,0,0.55)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, y0 - 70 * S, W, 160 * S); ctx.restore();
    const lift = (1 - eOutCubic(P(t, a, a + .25))) * 8 * S;
    if (PORTRAIT && measure(c.zh, 40, 500) > maxW) {
      // wrap zh at the middle punctuation for the 1080-wide frame
      const parts = splitZh(c.zh);
      txt(parts[0], W / 2, y0 - 26 * S + lift, { size: 40, weight: 500, alpha: al, maxW, tag: 'sub' });
      txt(parts[1], W / 2, y0 + 26 * S + lift, { size: 40, weight: 500, alpha: al, maxW, tag: 'sub' });
      wrapEn(c.en, y0 + 82 * S + lift, al, maxW);
    } else {
      txt(c.zh, W / 2, y0 + lift, { size: 40, weight: 500, alpha: al, maxW, tag: 'sub' });
      wrapEn(c.en, y0 + 52 * S + lift, al, maxW);
    }
  }
}
function splitZh(s) {
  const mid = s.length / 2; let best = -1, bd = 1e9;
  [...s].forEach((ch, i) => { if ('，、：'.includes(ch) && Math.abs(i - mid) < bd) { bd = Math.abs(i - mid); best = i; } });
  if (best < 0) best = Math.floor(mid);
  return [s.slice(0, best + 1), s.slice(best + 1)];
}
function wrapEn(s, y, al, maxW) {
  if (measure(s, 25, 400, LAT) <= maxW) { txt(s, W / 2, y, { size: 25, fam: LAT, weight: 400, color: 'rgba(245,239,230,0.78)', alpha: al, maxW, tag: 'sub' }); return; }
  const words = s.split(' '); let a = '', i = 0;
  while (i < words.length && measure((a + ' ' + words[i]).trim(), 25, 400, LAT) <= maxW * .62) { a = (a + ' ' + words[i]).trim(); i++; }
  const b = words.slice(i).join(' ');
  txt(a, W / 2, y, { size: 25, fam: LAT, weight: 400, color: 'rgba(245,239,230,0.78)', alpha: al, maxW, tag: 'sub' });
  txt(b, W / 2, y + 32 * S, { size: 25, fam: LAT, weight: 400, color: 'rgba(245,239,230,0.78)', alpha: al, maxW, tag: 'sub' });
}

// ───────────────────────── shared pieces ─────────────────────────
function glitchText(s, x, y, o, t, amt) {
  // RGB split + horizontal slice jitter
  const r = rng(Math.floor(t * 30) + 5);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  txt(s, x - amt * 9 * S, y, { ...o, color: 'rgba(255,40,60,0.85)', noAudit: true });
  txt(s, x + amt * 9 * S, y, { ...o, color: 'rgba(40,200,255,0.75)', noAudit: true });
  ctx.restore();
  txt(s, x, y, o);
  if (amt > .05) {
    const h = o.size * S * 1.2, slices = 5;
    for (let i = 0; i < slices; i++) {
      if (r() > amt) continue;
      const sy = y - h / 2 + r() * h, sh = (4 + r() * 18) * S, dx = (r() - .5) * 60 * S * amt;
      try { ctx.drawImage(cv, 0, sy, W, sh, dx, sy, W, sh); } catch (e) { }
    }
  }
}
function pixelLogo(cx, cy, cell, alpha, o = {}) {
  const cols = 35, rows = 7, w = cols * cell, h = rows * cell;
  ctx.save(); ctx.globalAlpha *= alpha;
  if (o.glow) { ctx.shadowColor = COL.or; ctx.shadowBlur = o.glow * S; }
  ctx.fillStyle = o.color || COL.or;
  for (const [c, r] of LOGO_PTS) ctx.fillRect(cx - w / 2 + c * cell, cy - h / 2 + r * cell, cell * .88, cell * .88);
  ctx.restore();
}
function check(x, y, s, color, prog = 1) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 3 * S; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); const p1 = [x - s * .45, y], p2 = [x - s * .12, y + s * .33], p3 = [x + s * .5, y - s * .38];
  const a = clamp(prog * 2), b = clamp(prog * 2 - 1);
  ctx.moveTo(...p1); ctx.lineTo(lerp(p1[0], p2[0], a), lerp(p1[1], p2[1], a));
  if (b > 0) ctx.lineTo(lerp(p2[0], p3[0], b), lerp(p2[1], p3[1], b));
  ctx.stroke(); ctx.restore();
}
function cross(x, y, s, color, prog = 1) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 3 * S; ctx.lineCap = 'round';
  const a = clamp(prog * 2), b = clamp(prog * 2 - 1);
  ctx.beginPath(); ctx.moveTo(x - s * .4, y - s * .4); ctx.lineTo(x - s * .4 + s * .8 * a, y - s * .4 + s * .8 * a);
  if (b > 0) { ctx.moveTo(x + s * .4, y - s * .4); ctx.lineTo(x + s * .4 - s * .8 * b, y - s * .4 + s * .8 * b); }
  ctx.stroke(); ctx.restore();
}
function ring(x, y, r, color, alpha, lw = 2) { ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.lineWidth = lw * S; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.stroke(); ctx.restore(); }
function flash(t, at, dur = .5, strength = .55, color = '255,236,214') {
  const p = P(t, at, at + dur); if (p <= 0 || p >= 1) return;
  ctx.fillStyle = `rgba(${color},${strength * (1 - eOutCubic(p))})`; ctx.fillRect(0, 0, W, H);
}
const STEPS = [
  ['read', 'data/payments.csv'], ['bash', 'python calc.py'], ['read', 'manual.md'], ['bash', 'sh run_tests.sh'],
  ['edit', 'calc.py'], ['bash', 'python calc.py'], ['grep', '"fee_id" manual.md'], ['bash', 'sh run_tests.sh'],
  ['write', 'notes.md'], ['bash', 'python report.py'], ['read', 'fees.json'], ['say', '"done."']];

// ───────────────────────── scenes ─────────────────────────
// A · cold open (0 – 7.1)
function sceneA(t) {
  if (t > 7.4) return;
  const al = 1 - P(t, 6.75, 7.15);
  ctx.save(); ctx.globalAlpha = al;
  if (t < 4.25) {
    // terminal prompt: agent › 做完了。
    const msg = '做完了。', n = Math.floor(clamp((t - .7) / .55) * msg.length);
    const big = PORTRAIT ? 150 : 170;
    const shown = msg.slice(0, n);
    const gl = t > 2.9 ? (P(t, 2.9, 3.05) * (1 - P(t, 3.4, 3.9))) : 0;
    const out = 1 - P(t, 3.55, 3.95);
    ctx.save(); ctx.globalAlpha *= out;
    txt('agent ›', CX, CY - big * .9 * S, { size: 22, fam: MONO, weight: 400, color: COL.dim, ls: 3, alpha: P(t, .3, .7) });
    if (shown) glitchText(shown, CX, CY, { size: big, weight: 900, ls: 4 }, t, gl);
    const cw = measure(shown, big, 900, ZH, 4);
    const blink = (Math.floor(t * 2.4) % 2 === 0 || (t > .7 && t < 1.3)) ? 1 : 0;
    if (t < 2.9) { ctx.fillStyle = COL.or; ctx.globalAlpha *= blink; ctx.fillRect(CX + cw / 2 + 14 * S, CY - big * S * .45, 10 * S, big * S * .9); }
    ctx.restore();
    // ✓ done chip
    const cp = P(t, 1.45, 1.85);
    if (cp > 0) {
      ctx.save(); ctx.globalAlpha = cp * out;
      check(CX - 52 * S, CY + big * .78 * S, 22 * S, COL.green, cp);
      txt('done · exit 0', CX + 22 * S, CY + big * .78 * S, { size: 22, fam: MONO, weight: 400, color: COL.green, alpha: 1 });
      ctx.restore();
    }
    // 真的嗎？
    const q = P(t, 3.55, 3.75);
    if (q > 0) {
      const gq = (1 - P(t, 3.75, 4.1)) * .9;
      glitchText('真的嗎？', CX, CY, { size: big * .82, weight: 900, color: COL.or, ls: 6, alpha: q, glow: 30 }, t, gq);
      txt('Is it, though?', CX, CY + big * .72 * S, { size: 30, fam: LAT, weight: 200, color: COL.ink, ls: 4, alpha: q * .85 });
    }
  } else {
    // the human audits every step: endless step list, each one gets a "?"
    const p = P(t, 4.25, 4.7);
    const rowH = 54 * S, listW = Math.min(W - 120 * S, 860 * S), x0 = CX - listW / 2;
    const scroll = eInOut(P(t, 4.4, 6.9)) * rowH * 7;
    const implode = eInCubic(P(t, 6.35, 7.05));
    for (let i = 0; i < 24; i++) {
      const [tool, arg] = STEPS[i % STEPS.length];
      let y = CY - rowH * 5.2 + i * rowH - scroll;
      if (y < CY - rowH * 6.5 || y > CY + rowH * 6.5) continue;
      const edge = 1 - clamp(Math.abs(y - CY) / (rowH * 6.2));
      const cx = x0 + listW / 2;
      const yy = lerp(y, CY, implode), sc = 1 - implode * .9;
      ctx.save(); ctx.globalAlpha *= p * edge * (1 - implode * .8);
      ctx.translate(cx, yy); ctx.scale(sc, sc); ctx.translate(-cx, -yy);
      const hiY = CY - rowH * .5 + (Math.sin(t * 3.1) * rowH * 2.2);
      const hot = Math.abs(y - hiY) < rowH * .6;
      ctx.fillStyle = hot ? 'rgba(242,107,29,0.14)' : 'rgba(245,239,230,0.035)';
      rrect(x0, yy - rowH * .42, listW, rowH * .84, 8 * S); ctx.fill();
      txt(`#${String(i + 1).padStart(2, '0')}`, x0 + 22 * S, yy, { size: 20, fam: MONO, weight: 400, color: COL.dim, align: 'left', noAudit: true });
      txt(tool, x0 + 100 * S, yy, { size: 22, fam: MONO, weight: 700, color: hot ? COL.or : COL.ink, align: 'left', noAudit: true });
      txt(arg, x0 + 190 * S, yy, { size: 22, fam: MONO, weight: 400, color: COL.mono, align: 'left', maxW: listW - 290 * S, noAudit: true });
      const qa = P(t, 4.5 + i * .09, 4.8 + i * .09);
      txt('?', x0 + listW - 34 * S, yy, { size: 30, weight: 900, color: COL.or, alpha: qa, scale: lerp(1.8, 1, eOutBack(qa)), noAudit: true });
      ctx.restore();
    }
    // magnifier ring (the human, auditing)
    const mx = x0 + listW * .62 + Math.cos(t * 1.7) * 40 * S, my = CY + Math.sin(t * 3.1) * rowH * 2.2 - rowH * .5;
    ring(mx, my, 46 * S, COL.ink, p * .5 * (1 - implode), 2);
    ctx.save(); ctx.globalAlpha = p * .5 * (1 - implode); ctx.strokeStyle = COL.ink; ctx.lineWidth = 3 * S;
    ctx.beginPath(); ctx.moveTo(mx + 33 * S, my + 33 * S); ctx.lineTo(mx + 62 * S, my + 62 * S); ctx.stroke(); ctx.restore();
    // implosion point
    if (implode > 0) { ctx.save(); ctx.globalAlpha = implode; ctx.shadowColor = COL.or; ctx.shadowBlur = 50 * S; ctx.fillStyle = '#fff3e6'; ctx.beginPath(); ctx.arc(CX, CY, 6 * S * implode, 0, 6.28); ctx.fill(); ctx.restore(); }
  }
  ctx.restore();
  deep(t, ['trace/capture.py', 'hook: Stop · turn_end · session.idle', 'the moment an agent says "done"'], .6, 4.1);
}

// B · logo reveal (7.0 – 11.4)
function logoParticles(t, a, b, cx, cy, cell, seed, fromFn) {
  const r = rng(seed);
  LOGO_PTS.forEach(([c, row], i) => {
    const tx = cx - 35 * cell / 2 + c * cell, ty = cy - 7 * cell / 2 + row * cell;
    const [fx, fy] = fromFn(r, i);
    const d = (c / 35) * .35 + r() * .15;
    const p = eOutExpo(P(t, a + d, b + d));
    const x = lerp(fx, tx, p), y = lerp(fy, ty, p);
    ctx.fillStyle = p > .98 ? COL.or : `rgba(255,190,140,${.4 + .6 * p})`;
    const s = cell * .88 * lerp(.35, 1, p);
    ctx.fillRect(x, y, s, s);
    if (p < .98) { ctx.fillStyle = 'rgba(242,107,29,0.25)'; ctx.fillRect(lerp(fx, tx, p * .8), lerp(fy, ty, p * .8), s * .6, s * .6); }
  });
}
function sceneB(t) {
  if (t < 6.9 || t > 11.6) return;
  const out = 1 - P(t, 10.65, 11.05);
  const cell = (PORTRAIT ? 26 : 30) * S;
  const ly = CY - (PORTRAIT ? 120 : 90) * S - eInOut(P(t, 10.65, 11.05)) * 80 * S;
