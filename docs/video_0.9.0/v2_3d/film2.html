function splitZh(s) { const mid = s.length / 2; let best = -1, bd = 1e9; [...s].forEach((ch, i) => { if ('，、：'.includes(ch) && Math.abs(i - mid) < bd) { bd = Math.abs(i - mid); best = i; } }); if (best < 0) best = Math.floor(mid); return [s.slice(0, best + 1), s.slice(best + 1)]; }

  while (i < words.length && measure((a + ' ' + words[i]).trim(), 24, 400, LAT) <= maxW * .6) { a = (a + ' ' + words[i]).trim(); i++; }

}
